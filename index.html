"html": "<h3>Buiksloterham: van industriegebied naar circulair stadslab</h3>\n<p>Buiksloterham ligt op de noordelijke IJ-oever, tussen de NDSM-werf en Overhoeks. Eeuwenlang buitendijks land, werd het in de 20e eeuw een zwaar industriegebied met onder meer Shell. Vanaf de jaren 1980 verschoof de industrie naar het westen en besloot Amsterdam de noordelijke IJ-oevers om te vormen tot woon-werkgebied. Het bestemmingsplan van 2009 was bewust niet-prescriptief: geen vastgelegd eindbeeld, maar zoveel mogelijk flexibiliteit voor 'organische' ontwikkeling, met kleine kavels en veel zelfbouw.</p>\n<p>In 2015 ondertekenden 22 partijen — gemeente, woningcorporaties, ontwikkelaars, kennisinstellingen en bewoners — het <strong>Manifest Circulair Buiksloterham</strong>, gebaseerd op de 'donuteconomie' van Kate Raworth. Het gebied werd een 'living lab' met doelen op negen terreinen, van afvalstromen en zelfvoorzienende energie tot inclusie en diversiteit. Iconen daarvan zijn De Ceuvel (tijdelijke circulaire broedplaats) en Schoonschip (drijvende duurzame woonwijk). Critici vragen zich intussen af hoeveel van de circulaire ambities overeind blijven naarmate de bouw versnelt, en hoeveel groen er overblijft.</p>\n<h3>Cityplot: de stad als ecosysteem</h3>\n<p>Cityplot is de methode die Studioninedots ontwikkelde tijdens de crisis na 2008, toen grote masterplannen onhaalbaar waren. In plaats van een vast eindbeeld legt Cityplot een beperkt aantal spelregels vast en laat het de invulling open, als 'een veerkrachtig stedelijk systeem dat zich voortdurend kan aanpassen aan de veranderende behoeften van de gemeenschap'. Albert Herder verwijst naar historische binnensteden zoals Leiden, waar diverse functies organisch naast elkaar zijn gegroeid. Diversiteit maakt het systeem volgens hem veerkrachtig, 'omdat het minder tegelijk onder druk komt te staan'.</p>\n<p>De spelregels in Buiksloterham:\n- Drie bouwvelden van 100 × 100 meter, 'de ideale maat voor een bouwblok', elk met een groene binnenhof.\n- Elk gebouw spreekt zijn eigen architectuurtaal; tien bureaus en zelfbouwers ontwierpen de verschillende gebouwen.\n- Een ringvormige opzet zonder achterkanten of restruimtes.\n- <strong>'Urban activators'</strong>: ruimtes op de begane grond voor lokale ondernemers, makers en sociale functies.\n- Een gemengd programma van sociale huur, vrije sector, koop, zelfbouw en woon-werkeenheden.\n- Autoluw: twee abstracte parkeergebouwen bundelen auto's, fietsen en energieopwekking, zodat het maaiveld voor voetgangers is.</p>\n<p>DELVA ontwierp een gelaagde buitenruimte met afwisselend publieke, semipublieke, collectieve en private delen, grote bomen en open tuinen. Het regenwater wordt opgevangen in wadi's, op daken en in kratten en loopt af naar het Tolhuiskanaal.</p>\n<h3>Erkenning</h3>\n<p>Cityplot Buiksloterham werd in 2022 genomineerd voor de NRP Gulden Feniks, de Nederlandse prijs voor transformatie en gebiedsontwikkeling. De jury waardeerde vooral de combinatie van 'zelfbouw met sociale huur, wonen met werken, en collectieve bouwgroepen met beleggers'. De urban activators zijn daarbij geen tijdelijke initiatieven maar permanente onderdelen van de wijk. De inzending werd gedragen door Studioninedots samen met de Alliantie, Synchroon, DELVA, de betrokken architecten en de gemeente.</p>\n<h3>Sociale circulariteit</h3>\n<p>Opvallend is de sociale laag. Zorgorganisatie Philadelphia huurt 24 woningen voor cliënten met een verstandelijke beperking en organiseert dagbesteding en buurtuitwisseling vanuit de gemeenschappelijke ruimtes. Bedrijfjes zoals een fietsenmakerij bieden werk aan mensen met een afstand tot de arbeidsmarkt. In drie gebouwen zijn gedeelde ruimtes met wasmachines voorzien. Herder benadrukt dat gemeenschapsvorming al tijdens de bouw begint, niet pas erna.</p>\n<h3>Lessen</h3>\n<p>Herder is eerlijk over de knelpunten: op één bouwveld werkten soms zestien aannemers tegelijk. Latere Cityplot-projecten in Groningen, Utrecht en Arnhem kregen een gestroomlijnder aannemersmodel. Ook de dichtheid blijft een discussiepunt in de context van de Amsterdamse woningnood.</p>\n<h3>Om op te letten tijdens de doorrit</h3>\n<ul>\n<li>De diversiteit van de gevels binnen één bouwveld.</li>\n<li>De plint: welke 'urban activators' zijn er echt ingevuld?</li>\n<li>De parkeergebouwen als architectuurobject.</li>\n<li>De overgang van publieke straat naar collectieve binnenhof.</li>\n<li>De relatie met het water van het Tolhuiskanaal.</li>\n</ul>\n<h3 class=\"src\">Bronnen en verder lezen</h3>\n<ul>\n<li><a href=\"https://www.archdaily.com/1028455/cityplot-buiksloterham-studioninedots-plus-delva-landscape-architecture\" target=\"_blank\" rel=\"noopener\">ArchDaily — Cityplot Buiksloterham</a></li>\n<li><a href=\"https://studioninedots.nl/project/cityplot-buiksloterham/\" target=\"_blank\" rel=\"noopener\">Studioninedots — Cityplot Buiksloterham</a></li>\n<li><a href=\"https://www.metalocus.es/en/news/strategic-and-resilient-cityplot-buiksloterham-studioninedots\" target=\"_blank\" rel=\"noopener\">Metalocus — Strategic and resilient</a></li>\n<li><a href=\"https://magazines.amsterdam.nl/stad-op-ooghoogte/cityplot\" target=\"_blank\" rel=\"noopener\">Gemeente Amsterdam — Stad op ooghoogte: Cityplot</a></li>\n<li><a href=\"https://www.gebiedsontwikkeling.nu/artikelen/buiksloterham-in-amsterdam-circulaire-stadswijk-in-wording/\" target=\"_blank\" rel=\"noopener\">Gebiedsontwikkeling.nu — Buiksloterham, circulaire stadswijk in wording</a></li>\n<li><a href=\"https://delva.la/nieuws/manifest-circulair-buiksloterham/\" target=\"_blank\" rel=\"noopener\">DELVA — Manifest Circulair Buiksloterham</a></li>\n</ul>",

"html": "<h3>Context: tijdelijk als strategie</h3>\n<p>De Ceuvel is het bekendste voorbeeld van de tijdelijke, circulaire experimenten waarmee Buiksloterham na 2010 op de kaart kwam. In 2012 schreef de gemeente, samen met stadsvernieuwingsorganisatie Noordwaarts, een prijsvraag uit voor een broedplaats op het terrein van de voormalige scheepswerf Ceuvel Volharding. De randvoorwaarden waren onverbiddelijk: de grond was zwaar vervuild met zware metalen, asbest en PAK's, en de gebruiksduur was beperkt tot tien jaar. Een klassieke sanering, waarbij de grond wordt afgegraven en afgevoerd, en klassieke funderingen waren in die tijdspanne onbetaalbaar.</p>\n<h3>Het concept: de grond laten zuiveren door planten</h3>\n<p>Het winnende team, onder leiding van space&amp;matter en DELVA, draaide de redenering om. In plaats van te saneren, wordt de grond gezuiverd door planten (<strong>fytoremediatie</strong>), en raken de gebouwen de grond nauwelijks. Landschapsarchitect Steven Delva noemt het park 'een werkende zuiveringsmachine'. Zorgvuldig gekozen grassen, riet, kruiden en wilgen met een hoge wortelactiviteit zetten de vervuiling om, nemen zware metalen op en brengen zuurstof in bodem en water. De biomassa die zo ontstaat, wordt in een bio-vergister omgezet in energie. Het park is een 'verboden tuin' waarin je niet mag lopen: je beleeft het vanaf een verhoogde houten steiger die alle boten verbindt.</p>\n<p>Voor de gemeente leverde deze aanpak volgens het Kenniscentrum Circulair Bouwen een besparing op van ongeveer €1 miljoen ten opzichte van een klassieke sanering. Na afloop moet de grond 'schoner worden teruggegeven dan ze werd ontvangen: een geschenk aan de stad'. Het onderzoek naar de zuiverende werking werd gevolgd door Wageningen University en de Universiteit Gent — een directe link met Vlaanderen.</p>\n<h3>Woonboten op het land</h3>\n<p>Op het gezuiverde landschap liggen afgedankte woonboten, als 'gestrand'. Ze werden opgeknapt en omgebouwd tot werkplaatsen en kantoren voor creatieve en sociale ondernemers. Door boten te gebruiken in plaats van nieuwbouw vermeed het team funderingen, werd bestaand materiaal hergebruikt (urban mining) en bleef alles verplaatsbaar: na tien jaar kunnen de boten weer weg. De boten werden geïsoleerd, kregen geschonken tweedehands ramen (ongeveer 250 stuks) en een eigen klimaatinstallatie.</p>\n<h3>Circulaire systemen</h3>\n<p>De Ceuvel mikt op bijna volledige zelfvoorzienendheid, als 'cleantech playground' en living lab:\n- <strong>composttoiletten</strong> die menselijk afval omzetten in meststof;\n- <strong>biologische filters</strong> (helofytenfilters) die grijs water zuiveren voor hergebruik;\n- <strong>zonnepanelen</strong> die ongeveer 60% van de energie leveren;\n- een <strong>bio-vergister</strong> die organisch afval en biomassa in energie omzet;\n- gebruikers ondertekenen een manifest met duurzaamheidsafspraken.</p>\n<p>Het café is een schoolvoorbeeld van hergebruik: meerpalen uit de Amsterdamse haven vormen de draagstructuur, wanden zijn gemaakt van gesplitste panelen van een strandpaviljoen, oude straatlantaarns dienen als verlichting en een sportzaalvloer als ondergrond.</p>\n<h3>Spanningen en toekomst</h3>\n<p>Archined noemde De Ceuvel in 2014 'een delicate oase'. Het project werd een onverwachte publiekstrekker met duizenden bezoekers, wat vragen oproept over drukte versus het karakter van een werkgemeenschap. Initiatiefnemer Sascha Glasl was ook kritisch over het eigen financieringsmodel: het succes steunde op geschonken tijd en materiaal, en dat is volgens hem 'niet duurzaam' als model voor andere projecten.</p>\n<p>De oorspronkelijke vergunning liep af in 2025. Ze werd verlengd tot 31 januari 2027, maar de toekomst is onzeker. De gemeente moet kiezen tussen sluiting, een openbare tender of een uitzondering voor een 'zeer uniek' project. De Ceuvel kreeg als experiment de <strong>'Zoöp'-status</strong>, een juridisch model dat de natuur een stem geeft in de besluitvorming. Wat gebeurt er met een tijdelijk project dat blijvend waardevol is geworden? Dat is een vraag die ook in Vlaamse steden speelt.</p>\n<h3>Waarom interessant voor ons</h3>\n<p>De Ceuvel laat zien hoe een randvoorwaarde (vervuilde grond, korte termijn) een ontwerpconcept wordt. Het is een zeldzaam project waar landschap, hergebruik, installaties en programma één samenhangend verhaal vormen, en het is sinds 2014 een referentie in elke discussie over circulaire gebiedsontwikkeling.</p>\n<h3>Om op te letten</h3>\n<ul>\n<li>De woonboten op het land en de hoogteverschillen van de steiger.</li>\n<li>De beplanting als zuiveringsinstallatie: welke soorten, welke zones?</li>\n<li>De details van het café uit hergebruikte onderdelen.</li>\n<li>Hoe 'tijdelijk' ziet het er na twaalf jaar nog uit?</li>\n</ul>\n<h3 class=\"src\">Bronnen en verder lezen</h3>\n<ul>\n<li><a href=\"https://www.archined.nl/2014/11/de-ceuvel-een-delicate-oase/\" target=\"_blank\" rel=\"noopener\">Archined — De Ceuvel, een delicate oase</a></li>\n<li><a href=\"https://arcam.nl/architectuur-gids/de-ceuvel/\" target=\"_blank\" rel=\"noopener\">Arcam — De Ceuvel</a></li>\n<li><a href=\"https://landezine.com/de-ceuvel-by-delva/\" target=\"_blank\" rel=\"noopener\">Landezine — De Ceuvel by DELVA</a></li>\n<li><a href=\"https://delva.la/en/projects/de-ceuvel/\" target=\"_blank\" rel=\"noopener\">DELVA — De Ceuvel</a></li>\n<li><a href=\"https://www.tudelft.nl/en/architecture-and-the-built-environment/circular-design-atlas/de-ceuvel\" target=\"_blank\" rel=\"noopener\">TU Delft Circular Design Atlas — De Ceuvel</a></li>\n<li><a href=\"https://kccb.nl/de-ceuvel-amsterdam-circulaire-broedplaats-op-vervuilde\" target=\"_blank\" rel=\"noopener\">KCCB — De Ceuvel, circulaire broedplaats op vervuilde grond</a></li>\n<li><a href=\"https://deceuvel.nl/en/about/general-information/\" target=\"_blank\" rel=\"noopener\">De Ceuvel</a></li>\n</ul>",

"html": "<h3>Van gesloten fabriekskavel naar stadsdorp</h3>\n<p>Het vertrekpunt was een gesloten fabriekskavel van 80 bij 80 meter, midden in het transformerende Buiksloterham. Het klassieke antwoord zou een gesloten bouwblok zijn. Marc Koehler deed het omgekeerde: 'We hebben de gegeven, gesloten fabriekskavel opengebroken tot een ensemble van zes gebouwen met pleinen en steegjes.' Hij spreekt van een 'doorwaadbaar stadsblok' en een 'circulair stadsdorp'. Tussen de gebouwen lopen publieke straatjes, trappen en intieme pleintjes in natuursteen; het blok is voetgangersgebied.</p>\n<p>De dichtheid is met een FSI van 3,3 hoog, maar door de opsplitsing in zes volumes van verschillende hoogte ontstaat een kleinschaliger, meer 'gegroeide' sfeer. De architectuur verwijst naar het industriële verleden van de plek via 'loft-architectuur': grote ramen, hoge plafonds en robuuste materialen.</p>\n<h3>Zes gebouwen, zes karakters</h3>\n<ol>\n<li><strong>Getrapt koopgebouw</strong> — 18 koopappartementen in een getrapt volume met terrassen.</li>\n<li><strong>Superlofts-toren</strong> — een micro-toren met tien duplex-lofts die kopers zelf indelen (zie verder).</li>\n<li><strong>Middenhuurgebouw</strong> — ontworpen door Loer Architecten.</li>\n<li><strong>Apart-hotel</strong> — 126 'mid-stay'-appartementen tussen hotel en wonen in.</li>\n<li><strong>Entreegebouw</strong> — wonen, kantoren en horeca.</li>\n<li><strong>Industriële loods</strong> — in recyclebaar cortenstaal.</li>\n</ol>\n<p>De materialen verschillen bewust per gebouw — hout, gerecycled beton, cortenstaal, hergebruikte Belgische baksteen en teruggewonnen natuursteen — en geven elk gebouw een eigen identiteit binnen een samenhangend geheel.</p>\n<h3>Open Building en Superlofts</h3>\n<p>Koehler is in Nederland een van de belangrijkste pleitbezorgers van <strong>Open Building</strong>, het gedachtegoed van John Habraken: scheid de lange-termijn-drager (structuur, kern, gevel) van de korte-termijn-invulling (indeling, afwerking), zodat gebouwen kunnen meegroeien met hun gebruikers. Elk gebouw in Republica heeft een eigen, onafhankelijk constructief systeem met demonteerbare componenten, hoge plafonds en flexibele plattegronden.</p>\n<p>De <strong>Superlofts</strong> zijn het bekendste product van die aanpak: Koehler levert een casco van zes meter hoog, en kopers bepalen zelf indeling, grootte en afwerking — een vorm van collectief particulier opdrachtgeverschap binnen een professioneel ontwikkelde toren. Het eerste Superlofts-gebouw verrees in 2016 in de Houthavens (dat zien we later vandaag); intussen is het concept uitgerold in Amsterdam-Noord, Utrecht en Delft.</p>\n<h3>Energie en kringlopen</h3>\n<p>Republica is energiepositief. Zo'n 1.500 m² zonnepanelen op de daken, bodemenergie en een batterij van 1 MW voeden een lokaal micro-grid, beheerd door een energiecoöperatie van bewoners en gebruikers. Grijs water wordt hergebruikt, warmte teruggewonnen, voedselafval verwerkt en regenwater opgevangen. Afval, logistiek en parkeren (98 plaatsen met laadpalen) zitten in een half verdiepte garage, zodat het maaiveld maximaal levendig blijft.</p>\n<h3>Het publieke dak</h3>\n<p>Een opvallend programmaonderdeel is de daksauna met zwembad, met uitzicht over het IJ. Samen met de café-restaurants, de gym en de coworking maakt dat van Republica een bestemming voor de hele buurt en niet alleen een woonblok.</p>\n<h3>Waarom interessant voor ons</h3>\n<p>Republica is een interessant tegenmodel voor het gesloten bouwblok: hoge dichtheid, maar opgeknipt in kleinere volumes met publieke tussenruimte. De combinatie van Open Building, casco-verkoop (Superlofts) en een energiecoöperatie is een pakket dat ook in Vlaamse stadsprojecten relevant is.</p>\n<h3>Om op te letten tijdens de doorrit</h3>\n<ul>\n<li>De publieke doorsteken en pleintjes tussen de zes gebouwen.</li>\n<li>De verschillende gevelmaterialen, waaronder hergebruikte Belgische baksteen.</li>\n<li>De Superlofts-toren en de hoogte van de casco's.</li>\n<li>De daksauna als publieke functie.</li>\n</ul>\n<h3 class=\"src\">Bronnen en verder lezen</h3>\n<ul>\n<li><a href=\"https://architectenweb.nl/projecten/project.aspx?id=46990\" target=\"_blank\" rel=\"noopener\">Architectenweb — Republica: een doorwaadbaar stadsblok</a></li>\n<li><a href=\"https://architectenweb.nl/nieuws/artikel.aspx?id=57881\" target=\"_blank\" rel=\"noopener\">Architectenweb — Marc Koehler presenteert ensemble van zes gebouwen</a></li>\n<li><a href=\"https://www.e-architect.com/amsterdam/republica-buiksloterham-amsterdam-noord-housing\" target=\"_blank\" rel=\"noopener\">e-architect — Republica, Buiksloterham</a></li>\n<li><a href=\"https://arcam.nl/architectuur-gids/superlofts-houthaven/\" target=\"_blank\" rel=\"noopener\">Arcam — Superlofts Houthaven</a></li>\n<li><a href=\"https://www.wearebeyond.work/beyond-republica-campus\" target=\"_blank\" rel=\"noopener\">beyond Republica Campus</a></li>\n</ul>",

"html": "<h3>Het bureau</h3>\n<p>Civic Architects is een Amsterdams bureau dat zich profileert met 'publieke architectuur': gebouwen die bijdragen aan het collectieve leven van de stad. Hun bekendste project is de LocHal in Tilburg, een voormalige locomotievenloods die werd omgevormd tot bibliotheek en publieke huiskamer. Dat Civic zich met een klein woongebouw van tien woningen bezighoudt, is dan ook interessant: hoe maak je een privaat programma toch tot een publiek herkenningspunt?</p>\n<h3>Een baken in de bocht</h3>\n<p>Het gebouw staat op een scharnierpunt: in een bocht van het Tolhuiskanaal, waar het water van richting verandert, op de rand van Cityplot en met zicht op Overhoeks en het IJ. Civic behandelt het als een <strong>'nautisch baken'</strong>, een oriëntatiepunt vanaf het water, passend bij de havengeschiedenis van Buiksloterham.</p>\n<p>De vorm volgt de bocht van het kanaal. De geknikte gevel is niet alleen een stedenbouwkundig gebaar maar ook een akoestische oplossing: 'de knik in de gevel voorkomt geluidshinder van het water en de haven, omdat de vorm de richting van dat geluid volgt'. Daardoor waren geen extra geluidsschermen nodig en ontstaat er een rustig terras op het zuidwesten. De woonkamers en terrassen liggen op de open hoeken, met diagonale schuifdeuren die uitzicht in twee richtingen geven. De centrale kolommen zijn gedraaid in de richting van de bocht.</p>\n<h3>Flexibele woningen, meerdere generaties</h3>\n<p>De plattegronden zijn opgebouwd uit twee basisbreedtes. De kleinere woningen van <strong>7,5 meter</strong> breed laten toe drie kamers samen te voegen tot twee of één, naargelang de gezinssituatie verandert. De grotere woningen van <strong>15 meter</strong> breed kunnen een 'kangoeroewoning' bevatten — een aparte eenheid voor ouders of volwassen kinderen — of een atelier of kantoor met een eigen ingang. De drie penthouses zijn expliciet ontworpen als meergeneratiewoningen: een antwoord op de vraag hoe gezinnen in de stad kunnen blijven wonen en voor elkaar kunnen zorgen.</p>\n<h3>Klimaat zonder techniek</h3>\n<p>Veel van de duurzaamheid zit in het ontwerp zelf:\n- de <strong>zuidgevel heeft geen ramen</strong>, zodat de woningen in de zomer niet oververhitten;\n- <strong>luifels en balkons</strong> aan oost en west houden de hoge zomerzon buiten en laten de lage winterzon binnen;\n- een <strong>groen dak</strong> houdt regenwater vast, en het gebouw is aangesloten op het circulaire watersysteem van de buurt;\n- <strong>zonnepanelen</strong> leveren de energie voor de koeling.</p>\n<h3>Materiaal en dak</h3>\n<p>Industriële stalen panelen op de gesloten geveldelen verwijzen naar het havenverleden. Het dak loopt in twee richtingen af en krijgt een dubbele vin die de schoorstenen verbergt. In samenwerking met het Parijse Studio Matters werd daar een kunstwerk van gemaakt, het <strong>'Buurtkompas'</strong>: in de zigzagplooien van de bekleding lees je, afhankelijk van waar je staat, <strong>BAK</strong> en <strong>STUUR</strong> (links en rechts aan boord) of <strong>NOORD</strong> en <strong>ZUID</strong>. Het gebouw wordt zo letterlijk een wegwijzer voor de buurt.</p>\n<h3>Waarom interessant voor ons</h3>\n<p>Het is een klein, bescheiden project, maar het toont hoe een bureau met een sterke publieke agenda zelfs een kleinschalig woongebouw een rol in de stad kan geven. De combinatie van meergeneratiewonen, eenvoudige passieve klimaatstrategieën en een gebouw dat op zijn plek 'antwoordt' is direct vertaalbaar naar de schaal waarop wij werken.</p>\n<h3>Om op te letten tijdens de doorrit</h3>\n<ul>\n<li>De geknikte gevel in de bocht van het kanaal en het rustige terras erachter.</li>\n<li>De raamloze zuidgevel met de stalen panelen.</li>\n<li>Het Buurtkompas op het dak: probeer BAK, STUUR, NOORD en ZUID te lezen.</li>\n<li>De relatie met YOTEL en Deck ernaast.</li>\n</ul>\n<h3 class=\"src\">Bronnen en verder lezen</h3>\n<ul>\n<li><a href=\"https://www.civicarchitects.eu/projects/tolhuiskade-amsterdam\" target=\"_blank\" rel=\"noopener\">Civic Architects — Tolhuiskade</a></li>\n<li><a href=\"https://architectenweb.nl/nieuws/artikel.aspx?id=58918\" target=\"_blank\" rel=\"noopener\">Architectenweb — Woongebouw Civic vormt herkenningspunt langs Tolhuiskanaal</a></li>\n<li><a href=\"https://architectenweb.nl/nieuws/artikel.aspx?ID=55587\" target=\"_blank\" rel=\"noopener\">Architectenweb — Nautisch baken voor Buiksloterham</a></li>\n<li><a href=\"https://afasiaarchzine.com/2025/07/tolhuiskade-residences-amsterdam-civic-architects/\" target=\"_blank\" rel=\"noopener\">Afasia — Tolhuiskade residences</a></li>\n<li><a href=\"https://divisare.com/projects/536509-civic-architects-stijn-bollaert-tolhuiskade-residential-building\" target=\"_blank\" rel=\"noopener\">Divisare — Tolhuiskade residential building</a></li>\n</ul>",

"html": "<h3>Context: Overhoeks</h3>\n<p>Overhoeks is de nieuwe wijk op het voormalige Shell-terrein aan de noordelijke IJ-oever, recht tegenover het Centraal Station. Het is het visitekaartje van Amsterdam-Noord, met de A'DAM Toren (het voormalige Shell-kantoor van Arthur Staal) en het EYE Filmmuseum van Delugan Meissl. Tussen de woontorens is grond schaars en duur. Een school met een klassiek schoolplein en een uitgestrekt, laag gebouw was hier geen optie.</p>\n<p>Een <strong>integraal kindcentrum</strong> (IKC) bundelt onderwijs en opvang voor kinderen van 0 tot 12 jaar in één gebouw en één pedagogisch concept, zodat een kind er de hele dag kan zijn: opvang, school, naschoolse opvang. Dat vraagt ruimtes die over de dag heen verschillend gebruikt kunnen worden.</p>\n<h3>Het architectenbureau</h3>\n<p>Rudy Uytenhaak is sinds de jaren 1980 een van de vaste waarden van de Nederlandse woningbouw en was jarenlang hoogleraar aan de TU Eindhoven. Zijn werk wordt gekenmerkt door een grote aandacht voor de gevel als gelaagd element, en voor licht en dichtheid. Die thema's komen hier terug in een schoolgebouw.</p>\n<h3>Gestapeld en getrapt</h3>\n<p>Uytenhaak ontwierp een <strong>compact, getrapt en gestapeld gebouw</strong> van vijf lagen. Het volume neemt per verdieping af, zodat op elk niveau dakterrassen ontstaan die als buitenspeel- en buitenleerruimte dienen. Zo wordt het ontbrekende schoolplein verticaal teruggewonnen. De klasclusters liggen op de onderste lagen; de 'Beweegbox', een interactieve ruimte voor bewegingsonderwijs, zit op de derde verdieping.</p>\n<p>De getrapte, opengewerkte gevel aan het plein 'versterkt de relatie met de omgeving en nodigt uit tot ontmoeting en samenwerking'. Het gebouw is transparant en open: je ziet van buiten wat er binnen gebeurt.</p>\n<h3>De cascadetrap als levend hart</h3>\n<p>Het hart van het gebouw is een open, houten <strong>cascadetrap</strong> in het midden, badend in daglicht, die naar boven opent naar de terrassen. Hij is tegelijk verbinding, tribune, verzamelplek en speelplek, en biedt ook intimiteit. Rond de trap liggen clusters van vier tot zes flexibele lokalen per laag. Kinderen bewegen zich zo voortdurend door een centrale ruimte die het gebouw overzichtelijk en sociaal maakt.</p>\n<p>Een heldere kolommenstructuur met vouwwanden laat toe het gebouw aan te passen aan veranderende onderwijsvormen. Ruimtes kunnen samengevoegd of gescheiden worden, en over de dag heen wisselend gebruikt: 's ochtends klas, 's middags opvang.</p>\n<h3>Gevel en materialen</h3>\n<p>De gevel wisselt lange raambanden met <strong>brons/champagne-geanodiseerde aluminium kozijnen</strong> af met <strong>zandkleurige keramische gevelpanelen</strong>. Binnen: hoge plafonds, grote glasvlakken, warm hout, lichtgrijze vloeren en witte wanden — 'een moderne, transparante sfeer met een warme uitstraling'.</p>\n<h3>Duurzaamheid en binnenklimaat</h3>\n<p>Het gebouw voldoet aan BENG (bijna-energieneutraal) en aan de Frisse Scholen-richtlijnen klasse B voor binnenklimaat: drievoudig glas, zonwerend glas, buitenzonwering, hoge isolatiewaarden en slimme klimaatregeling. Voor een gebouw met zoveel glas is dat een bewuste evenwichtsoefening.</p>\n<h3>Waarom interessant voor ons</h3>\n<p>IKC Overhoeks is een schoolvoorbeeld van hoe je een onderwijsprogramma stapelt op een krap perceel zonder dat het een kantoorgebouw voor kinderen wordt. Een vergelijking met Xplore dezelfde ochtend is leerzaam. Het zijn twee hedendaagse scholen in Amsterdam-Noord, allebei met een centrale ruimte als hart. De ene staat op een ruim perceel in een uitbreidingswijk, de andere is verticaal gestapeld in een hoogstedelijke context.</p>\n<h3>Om op te letten</h3>\n<ul>\n<li>De getrapte massa en de dakterrassen als speelplaatsen.</li>\n<li>De keramische gevel en de bronzen kozijnen van dichtbij.</li>\n<li>Door het glas: de cascadetrap.</li>\n<li>Hoe het gebouw zich verhoudt tot de hoogbouw en de A'DAM Toren.</li>\n</ul>\n<h3 class=\"src\">Bronnen en verder lezen</h3>\n<ul>\n<li><a href=\"https://architectenweb.nl/nieuws/artikel.aspx?id=49285\" target=\"_blank\" rel=\"noopener\">Architectenweb — IKC Overhoeks in gebruik genomen</a></li>\n<li><a href=\"https://www.uytenhaak.nl/project/ikc-overhoeks/\" target=\"_blank\" rel=\"noopener\">RU+PA — IKC Overhoeks</a></li>\n<li><a href=\"https://bna.nl/gebouw-van-het-jaar/inzendingen/2021/ikc-overhoeks-amsterdam/\" target=\"_blank\" rel=\"noopener\">BNA — IKC Overhoeks, Gebouw van het Jaar 2021</a></li>\n<li><a href=\"https://architectenweb.nl/projecten/project.aspx?id=36724\" target=\"_blank\" rel=\"noopener\">Architectenweb — projectpagina</a></li>\n</ul>",

"html": "<h3>Context: de poort van IJburg</h3>\n<p>IJburg is de grootste Amsterdamse stadsuitbreiding van de voorbije decennia: een archipel van kunstmatige eilanden in het IJmeer, aangelegd vanaf eind jaren 1990. Steigereiland is het eerste eiland dat je bereikt als je over de Enneus Heermabrug komt. Sluishuis staat op die kop, deels in het water, vlak bij de sluizen tussen het IJ en het IJmeer. Het gebouw moest letterlijk een poort worden: een welkom voor wie over het water of de weg IJburg binnenkomt.</p>\n<h3>De bureaus</h3>\n<p><strong>BIG</strong> (Bjarke Ingels Group, Kopenhagen en New York) is bekend om zijn 'hedonistische duurzaamheid' en om gebouwen die met één diagram een complexe opgave oplossen, zoals de Mountain Dwellings of de CopenHill-afvalcentrale met skipiste. <strong>Barcode Architects</strong> (Rotterdam, Dirk Peters) werkte als lokale partner mee aan het ontwerp en de uitwerking. Samen wonnen ze de tender voor de kavel.</p>\n<h3>Een Amsterdams bouwblok dat knielt</h3>\n<p>Het vertrekpunt is het klassieke Amsterdamse gesloten bouwblok, dat volgens Barcode 'een hedendaagse vertaling krijgt die specifiek inspeelt op de bijzondere ligging in het water'. Het blok wordt op twee manieren vervormd.</p>\n<p>Aan de <strong>waterzijde</strong> tilt het zich op. Twee tegenover elkaar liggende volumes kragen spectaculair uit over het water, en een grote uitsnede opent de binnenhof naar het IJmeer, zodat boten de 'binnenhaven' in kunnen varen. Bjarke Ingels: het gebouw 'rijst op uit de rivier en opent een gigantische poort voor boten'. Bewoners van de woningen onder de uitkraging 'zien de boten recht onder zich door varen'.</p>\n<p>Aan de <strong>kant van de wijk</strong> daalt het blok getrapt af tot op straatniveau, met groene terrassen. Het gebouw 'knielt om bezoekers uit te nodigen het dak te beklimmen'. Via twee grote trappen langs de schuine gevels bereik je een <strong>openbare dakwandeling</strong> met uitzicht over het IJmeer. Die publieke route is een wezenlijk onderdeel van het concept: het dak is niet van de bewoners alleen.</p>\n<p>Het resultaat is een volume dat uit elke hoek anders oogt, 'met spectaculaire uitzichten en voortdurend wisselende perspectieven'.</p>\n<h3>Materialen: schip en tuin</h3>\n<p>De materialisatie volgt de twee gezichten van het gebouw. Aan de waterzijde is de gevel bekleed met <strong>onbehandeld aluminium</strong> dat het water en het licht weerspiegelt — 'als de boeg van een schip in het water'. Aan de wijkkant en op de terrassen domineert <strong>hout</strong> met geïntegreerde plantenbakken, voor een warmere, uitnodigende uitstraling. In de hoven en op de daken staan inheemse planten.</p>\n<h3>Water als openbare ruimte</h3>\n<p>Rond het gebouw ligt een steigerlandschap met 34 woonboten, ligplaatsen, zitdekken en drijvende tuinen. De plint bevat een zeilschool, een watersportcentrum en een restaurant met zonneterras. Zo wordt het water niet alleen uitzicht maar ook gebruiksruimte.</p>\n<h3>Waarom interessant voor ons</h3>\n<p>Sluishuis toont hoe het gesloten bouwblok — de basis van zoveel stedelijke woningbouw — kan worden vervormd zonder zijn logica te verliezen: een binnenhof, een duidelijke rand, maar geopend naar landschap en publiek. De combinatie van 442 woningen, een hoge dichtheid en een publiek toegankelijk dak is een sterk argument voor openbaarheid in woningbouw.</p>\n<h3>Om op te letten tijdens de doorrit</h3>\n<ul>\n<li>De uitkraging boven het water en de 'poort' naar de binnenhaven.</li>\n<li>Het contrast aluminium/hout tussen de twee zijden.</li>\n<li>De getrapte terrassen en de publieke route over het dak — als er tijd is: naar boven.</li>\n<li>De woonboten en steigers als deel van het ontwerp.</li>\n</ul>\n<h3 class=\"src\">Bronnen en verder lezen</h3>\n<ul>\n<li><a href=\"https://www.dezeen.com/2022/07/14/barcode-architects-big-sluishuis-housing-amsterdam-ijburg/\" target=\"_blank\" rel=\"noopener\">Dezeen — BIG and Barcode cantilever housing block over IJ lake</a></li>\n<li><a href=\"https://barcodearchitects.com/projects/sluishuis/\" target=\"_blank\" rel=\"noopener\">Barcode Architects — Sluishuis</a></li>\n<li><a href=\"https://www.designboom.com/architecture/bjarke-ingels-group-barcode-architects-sluishuis-housing-amsterdam-netherlands-07-14-2022/\" target=\"_blank\" rel=\"noopener\">Designboom — BIG + Barcode complete Sluishuis</a></li>\n<li><a href=\"https://www.metalocus.es/en/news/a-residential-building-water-a-welcome-gesture-ijburg-sluishuis-barcode-architects-and-big\" target=\"_blank\" rel=\"noopener\">Metalocus — Sluishuis</a></li>\n<li><a href=\"https://www.theplan.it/eng/award-2023-Housing/sluishuis-a-renewing-adaptation-of-the-courtyard-housing-in-amsterdam-barcode-architects-big-bjarke-ingels-group\" target=\"_blank\" rel=\"noopener\">The Plan — Sluishuis</a></li>\n</ul>",

"html": "<h3>Context: Haveneiland</h3>\n<p>Jonas staat aan de haven van Haveneiland, het grootste eiland van IJburg, op een kavel die bij de binnenkomst van de haven een markant gebouw vroeg. Waar Sluishuis op Steigereiland zich letterlijk opent naar het water, kiest Jonas voor het omgekeerde: een gesloten, beschermende buitenkant en een spectaculaire binnenwereld.</p>\n<h3>De bureaus</h3>\n<p>Orange Architects is een Rotterdams bureau van Jeroen Schipper en Patrick Meijers. Hun werk staat bekend om sculpturale volumes en een sterke aandacht voor de gebruikerservaring. Jonas is hun meest besproken woongebouw.</p>\n<h3>Jonas en de walvis</h3>\n<p>De naam verwijst naar het Bijbelverhaal van Jonas in de buik van de walvis: een verhaal over avontuur, maar ook over 'bescherming en geborgenheid in een groot lichaam'. Die dubbelheid is het concept. Van buiten is Jonas een ruitvormig (diamantvormig) volume, opgetild boven het maaiveld en bekleed met donker, voorgepatineerd zink. De golvende raampatronen lijken over de gevel te bewegen, als golven of als de ribben van een dier. Het silhouet is gesloten, bijna massief: een beschutte huid tegen wind en water.</p>\n<h3>De Canyon</h3>\n<p>Binnen verrast het gebouw volledig. De ruimtelijke opbouw is geïnspireerd op de traditionele houten scheepsbouw: een skelet van spanten laat grote vides toe binnen de buitenhuid, terwijl het woonprogramma netjes in de schil blijft. Door het gebouw snijdt een monumentaal, over de volle hoogte doorlopend atrium, <strong>'de Canyon'</strong>, volledig bekleed met hout.</p>\n<p>Langs de Canyon slingert een <strong>'bergpad'</strong>: een route die langs elke verdieping loopt en de gedeelde voorzieningen verbindt. Bovenin brengt een glazen waterpartij op het dak gefilterd, bewegend daglicht naar beneden. DETAIL beschrijft het gebouw als 'vol landschapsreferenties': het strand op het dak, de met hout beklede canyon in het atrium, de grotachtige gemeenschappelijke ruimte. In het binnenhof staan berken, leisteenpaden en houten banken.</p>\n<p>Het gevolg is dat wie Jonas binnenkomt, een collectieve ruimte betreedt die zeldzaam is in huurwoningbouw: een gebouw dat is ontworpen om elkaar tegen te komen.</p>\n<h3>Gemeenschap als programma</h3>\n<p>De gedeelde voorzieningen — woonkamer, bioscoop, werkplekken, yogastudio en een strand met bar op het dak — worden beheerd door een <strong>communitymanager</strong> die activiteiten organiseert en het gebruik coördineert. Een deel ervan is ook voor buurtbewoners toegankelijk. Het gebouw richt zich met de vele compacte studio's en lofts vooral op jonge, alleenwonende stedelingen, voor wie de collectieve ruimte een verlengstuk van de eigen woning wordt.</p>\n<h3>Duurzaamheid</h3>\n<p>Jonas behaalde als tweede woongebouw in Nederland <strong>BREEAM Outstanding</strong>, het hoogste niveau:\n- energieneutraal dankzij zonnepanelen;\n- lage-temperatuurverwarming en koeling met <strong>thermische energie uit oppervlaktewater</strong> (TEO) uit het IJmeer;\n- CSC-gecertificeerd beton met 25% gerecycled materiaal;\n- opvang en hergebruik van regenwater;\n- inheemse oeverbeplanting, <strong>mosselriffen</strong> voor de waterkwaliteit en een <strong>oeverzwaluwwand</strong> als nestplek.</p>\n<h3>Waarom interessant voor ons</h3>\n<p>Jonas stelt de vraag hoeveel collectieve ruimte een woongebouw nodig heeft, en toont wat er gebeurt als je die ruimte niet wegmoffelt maar tot architectonische kern maakt. Het contrast met Sluishuis, een paar honderd meter verder, maakt de dag op IJburg tot een interessant tweeluik: open tegenover gesloten, publiek dak tegenover binnenwereld.</p>\n<h3>Om op te letten</h3>\n<ul>\n<li>De zinken gevel en de 'bewegende' ramen.</li>\n<li>Indien toegankelijk: de Canyon — maat, licht, houten afwerking en het bergpad.</li>\n<li>Het opgetilde volume en de entree.</li>\n<li>De ecologische maatregelen aan de waterkant.</li>\n</ul>\n<h3 class=\"src\">Bronnen en verder lezen</h3>\n<ul>\n<li><a href=\"https://orangearchitects.nl/projects/jonas/\" target=\"_blank\" rel=\"noopener\">Orange Architects — Jonas</a></li>\n<li><a href=\"https://www.metalocus.es/en/news/jonas-residential-building-a-scenographic-inside-and-amazing-outside-orange-architects\" target=\"_blank\" rel=\"noopener\">Metalocus — Jonas residential building</a></li>\n<li><a href=\"https://www.e-architect.com/amsterdam/jonas-building-ijburg\" target=\"_blank\" rel=\"noopener\">e-architect — Jonas building IJburg</a></li>\n<li><a href=\"https://www.detail.de/de_en/wohnungsbau-jonas-in-amsterdam-von-orange-architects\" target=\"_blank\" rel=\"noopener\">Detail — Wohnungsbau Jonas</a></li>\n<li><a href=\"https://archello.com/project/jonas\" target=\"_blank\" rel=\"noopener\">Archello — Jonas</a></li>\n</ul>",

"html": "<h3>Context: de terugkeer van de wooncoöperatie</h3>\n<p>In Zwitserland, Duitsland en Oostenrijk zijn wooncoöperaties een vaste pijler van betaalbaar wonen. In Nederland waren ze decennialang bijna verdwenen, verdrongen door de woningcorporaties. In 2018 lanceerde Amsterdam een tender waarbij kavels werden gereserveerd voor coöperatieve woningbouw. De Nieuwe Meent was een van de eersten die zo'n kavel verwierf, vlak bij station Science Park in de Watergraafsmeer.</p>\n<p>Het model is radicaal: de bewoners zijn samen opdrachtgever, codesigner en cofinancier. De woningen blijven collectief eigendom en 'kunnen niet verkocht worden; ze zijn permanent uit de markt gehaald'. Zo blijven ze voor altijd betaalbaar, ook voor mensen zonder eigen vermogen.</p>\n<h3>Architecten die ook initiatiefnemer waren</h3>\n<p>Opvallend: de architecten Mira Nekova en Roel van der Zeeuw waren tegelijk medeoprichters van het initiatief. Na het winnen van de tender stapten ze uit het bestuur om belangenvermenging te vermijden en werden ze 'gewone' architecten van de coöperatie. In workshops met de toekomstige bewoners — nog vóór de woningen werden toegewezen — diende architectuur volgens Nekova 'als instrument om gesprekken te voeren' over wat collectief wonen betekent.</p>\n<h3>Vier pijlers</h3>\n<p>Het ontwerp rust op vier waarden die de coöperatie samen formuleerde:\n- <strong>Commoning</strong> — veel gedeelde ruimte en collectief beheer. De verhouding privé/gedeeld is ongeveer 55/45.\n- <strong>Duurzaamheid</strong> — houtbouw, energiepositief, circulair.\n- <strong>Diversiteit</strong> — verschillende huishoudtypes, met advies van architect Ed Bijman over toegankelijkheid.\n- <strong>Zorg</strong> — het hele gebouw is rolstoeltoegankelijk, tot en met het dakterras via een loopbrug.</p>\n<p>Bewoners weigerden compromissen die deze waarden zouden aantasten.</p>\n<h3>Het gebouw</h3>\n<p>Op de begane grond en eerste verdieping liggen 15 zelfstandige sociale huurwoningen. Daarboven staat een toren van vijf lagen met op elke verdieping één woongroep van vijf personen, met een open, flexibele plattegrond. De gedeelde ruimtes zijn genereus: een dubbelhoge gemeenschappelijke lobby met woonruimte, een professionele keuken met een lange eettafel, een wasruimte, berging en werkplaats, een mezzanine voor gedeeld gebruik, een zonnige binnentuin als belangrijkste buitenruimte en een productief groen dak.</p>\n<h3>Betaalbaarheid als ontwerpopgave</h3>\n<p>Omdat de huren onder het plafond voor sociale huur moesten blijven, werd het budget 'omgekeerd' berekend vanuit het puntensysteem: hoeveel mag een woning kosten om die huur te halen? Dat stuurde veel keuzes. Een voorbeeld: de toren had een ongunstige verhouding tussen gevel en vloer. Om kosten en energieverlies te beperken werd de trap buiten de thermische schil geplaatst. Die <strong>buitentrap</strong> werd het beeldmerk van het gebouw.</p>\n<h3>Materiaal en uitdrukking</h3>\n<p>De dragende structuur is volledig in hout, met droge bouwsystemen die later aanpasbaar zijn. Rood geschilderde houten kozijnen en gevarieerde metselverbanden verwijzen naar de bakstenen jaren 1930-architectuur van de buurt, maar met een eigen identiteit. Van der Zeeuw noemt de architectuur 'ontspannen en toe-eigenbaar': ze laat bewoners zichzelf uitdrukken zonder alles voor te schrijven. Groene zones in de gevel vangen regenwater op en bieden nestruimte aan vogels, vleermuizen en insecten.</p>\n<h3>Waarom interessant voor ons</h3>\n<p>De Nieuwe Meent toont een alternatief voor zowel de markt als de klassieke sociale huisvesting. Voor Vlaanderen, waar coöperatief wonen nog in de kinderschoenen staat, is het een concreet voorbeeld van hoe financiering, ontwerp en gemeenschap samen worden opgebouwd.</p>\n<h3>Om op te letten</h3>\n<ul>\n<li>De buitentrap als gevolg van een bouwfysische en budgettaire keuze.</li>\n<li>De rode houten kozijnen tegenover de bakstenen buurt.</li>\n<li>De verhouding tussen private en gedeelde ruimte in de plint.</li>\n</ul>\n<h3 class=\"src\">Bronnen en verder lezen</h3>\n<ul>\n<li><a href=\"https://www.archined.nl/2026/08/betaalbare-architectuur-de-agenda-van-de-nieuwe-meent/\" target=\"_blank\" rel=\"noopener\">Archined — Betaalbare architectuur: de agenda van de Nieuwe Meent (2026)</a></li>\n<li><a href=\"https://arcam.nl/architectuur-gids/de-nieuwe-meent/\" target=\"_blank\" rel=\"noopener\">Arcam — De Nieuwe Meent</a></li>\n<li><a href=\"https://timetoaccess.com/projects/wooncooperatie-de-nieuwe-meent\" target=\"_blank\" rel=\"noopener\">Time to Access — Wooncoöperatie de Nieuwe Meent</a></li>\n<li><a href=\"https://afasiaarchzine.com/2026/05/de-nieuwe-meent-amsterdam-time-to-access/\" target=\"_blank\" rel=\"noopener\">Afasia — De Nieuwe Meent</a></li>\n<li><a href=\"https://www.bouwwereld.nl/rubrieken/supergaaf/de-nieuwe-meent-brengt-duurzaamheid-betaalbaarheid-en-collectief-wonen-samen/\" target=\"_blank\" rel=\"noopener\">Bouwwereld — De Nieuwe Meent</a></li>\n<li><a href=\"https://nieuwemeent.nl/en/gebouw/\" target=\"_blank\" rel=\"noopener\">De Nieuwe Meent — het gebouw</a></li>\n</ul>",

"html": "<h3>Van gevangenis tot woonwijk</h3>\n<p>De Bijlmerbajes, geopend in 1978 aan de rand van Amsterdam, was met haar zes hoge celtorens een van de bekendste gevangenissen van Nederland. Het gebouw werd in 2016 gesloten en tijdelijk gebruikt als opvang voor vluchtelingen. Intussen is de stad eromheen gegroeid en ligt het terrein centraal. Het complex bestond uit zes met elkaar verbonden celtorens, een administratiegebouw, binnenplaatsen en afzonderlijke tuinen, omsloten door een muur; de torens waren decennialang een herkenningspunt aan de rand van de stad. Het terrein was eigendom van het Rijksvastgoedbedrijf, dat het plan van OMA en ontwikkelaar AM selecteerde en de grond aan AM verkocht. Het ontwerpteam onder leiding van OMA-partners David Gianotten en Reinier de Graaf werkte samen met FABRICations en LOLA Landscape Architects.</p>\n<h3>Het masterplan: een eiland dat opengaat</h3>\n<p>OMA behield bewust het <strong>'eilandkarakter'</strong> van de gevangenis, omsloten door muren en water, maar verbond het terrein met de stad via nieuwe voetgangers- en fietsbruggen. De wijk is grotendeels autovrij, met tuinen en recreatieruimte. FABRICations werkte de duurzaamheid uit rond zes thema's van 'gezonde verstedelijking': gezond leven, vitale economie, veerkrachtige systemen, sociaal-culturele verbinding, energietransitie en materiaalkringlopen. Een van de gevangenistorens zou als publiek toegankelijke 'Groene Toren', een verticaal park, bewaard blijven.</p>\n<p>Opvallend is de <strong>circulaire hergebruikstrategie</strong>: prefab wandelementen van de gevangenis worden gevelbekleding van nieuwe gebouwen, tralies worden balustrades en celdeuren worden randpanelen van de nieuwe voetgangersbruggen. Zo blijft de geschiedenis van de plek letterlijk voelbaar in het nieuwe weefsel.</p>\n<p>Het masterplan bewaart delen van de gevangenisgeschiedenis — de monumentale gevangenismuur, de voetgangers- en fietsroute 'Kalverstraat' die de gevangenis doorkruiste — en verbindt het voorheen afgesloten terrein met het stedelijk weefsel. Het groepeert de nieuwe bebouwing in vier clusters rond een centraal plein. Bijzonder is het gemengde karakter: in de afgewerkte torens is 'het onderscheid tussen sociale huur en koop niet te zien'.</p>\n<h3>The Martin — OMA</h3>\n<p>The Martin is een van de vier woongebouwen die OMA zelf ontwierp. De vorm bestaat uit vier in elkaar grijpende kubussen, 'samengevoegd als een driedimensionale Japanse puzzel'. Die stapeling levert cascades van terrassen op met per oriëntatie een eigen karakter. Tegenover de massieve gevangenistorens staat een gelaagde, doorlatende gevel met balkons rondom het hele gebouw; een buitengrid bindt het geheel en glazen balustrades maken het wonen zichtbaar. Binnen is de organisatie eenvoudig: een centrale kern met twee atria van vijf lagen. Er zijn gemeenschappelijke dakterrassen op de 6e en 9e verdieping, zonnepanelen en een systeem dat voedselafval omzet in energie. The Martin kadert het centrale plein.</p>\n<h3>De Vrijheid — Atelier Kempe Thill</h3>\n<p>Het Rotterdams-Duitse Atelier Kempe Thill ontwierp met De Vrijheid een compacte woontoren met 140 sociale huurwoningen voor de Alliantie. Het gebouw bestaat uit twee delen: een sokkel van zes lagen (49,5 × 25 m) met een atrium en 14 woningen per laag, en daarop een toren van negen lagen (29,5 × 25 m) met 8 woningen per laag. De sokkel leest als een 'tafel' op zes massieve steunpunten met gepolijste terrazzo-elementen, waarop de slanke toren rust. Royale uitkragingen integreren de beschermde gevangenismuur en maken een entree op de hoek van het plein mogelijk.</p>\n<p>Het atrium van zes lagen, met daglicht van boven en een boom van 11 meter in de hal, is tegelijk entreehal, sociaal knooppunt en binnentuin. De gevels zijn uitgevoerd in drievoudig zonwerend glas met metalen roosterbalkons — het kenmerkende, bijna industriële vocabularium van Kempe Thill, dat al jaren onderzoekt hoe sociale woningbouw met maximale glasoppervlakken en minimale middelen genereus kan zijn. Twee groene daktuinen met 80 cm grond bieden collectieve buitenruimte. Het gebouw presteert ruim beter dan de BENG-eisen.</p>\n<h3>Waarom interessant voor ons</h3>\n<p>De Bajes toont hoe een enorm, gesloten institutioneel complex wordt omgevormd tot een stukje stad, en hoe twee zeer verschillende bureaus — het conceptuele OMA en het rigoureuze Kempe Thill — naast elkaar sociale en vrije sector woningbouw invullen.</p>\n<h3>Om op te letten tijdens de doorrit</h3>\n<ul>\n<li>Wat blijft er over van de gevangenis: muur, torens, de 'Kalverstraat'?</li>\n<li>De gestapelde kubussen van The Martin tegenover de strakke 'tafel' van De Vrijheid.</li>\n<li>De glasgevel van Kempe Thill en hoe privacy geregeld wordt.</li>\n</ul>\n<h3 class=\"src\">Bronnen en verder lezen</h3>\n<ul>\n<li><a href=\"https://www.oma.com/projects/bajes-kwartier\" target=\"_blank\" rel=\"noopener\">OMA — Bajes Kwartier</a></li>\n<li><a href=\"https://afasiaarchzine.com/2025/03/bajes-kwartier-amsterdam-oma/\" target=\"_blank\" rel=\"noopener\">Afasia — OMA Bajes Kwartier</a></li>\n<li><a href=\"https://www.archilovers.com/projects/349973/the-martin-at-bajes-kwartier.html\" target=\"_blank\" rel=\"noopener\">Archilovers — The Martin at Bajes Kwartier</a></li>\n<li><a href=\"https://architectenweb.nl/nieuws/artikel.aspx?id=59782\" target=\"_blank\" rel=\"noopener\">Architectenweb — Woontoren De Vrijheid opgeleverd</a></li>\n<li><a href=\"https://atelierkempethill.com/projects/0230-kavel-f-bajeskwartier/\" target=\"_blank\" rel=\"noopener\">Atelier Kempe Thill — Bajeskwartier De Vrijheid</a></li>\n<li><a href=\"https://arcam.nl/architectuur-gids/de-vrijheid-bajeskwartier/\" target=\"_blank\" rel=\"noopener\">Arcam — De Vrijheid</a></li>\n</ul>",

"html": "<h3>Van houthaven tot klimaatneutrale woonwijk</h3>\n<p>Al sinds de 17e eeuw werd hier hout verhandeld; in 1876 werd de Houthaven speciaal aangelegd als haven voor de houthandel, met lange aanloophavens waarin vlotten en schepen lagen. Na het verval in de tweede helft van de 20e eeuw raakte het gebied in onbruik. Rond 2005 startte de planvorming voor een woonwijk; de bouw begon rond 2010.</p>\n<p>Het plan van Ton Schaap brengt de oorspronkelijke richting van de aanloophavens terug in de vorm van grachten tussen <strong>zeven autovrije schiereilanden</strong>. Onder supervisie van Sjoerd Soeters — de architect van het Java-eiland, dat we donderdag zien — kreeg elk eiland een eigen architectonisch karakter, met verwijzingen naar pakhuizen, de Amsterdamse School en de baksteenarchitectuur van Dudok en Wright. De wijk werd ontwikkeld als <strong>klimaatneutraal</strong> gebied, aangesloten op stadsverwarming, en het doorgaande verkeer werd ondergronds gebracht. Het is een verre nazaat van het Oostelijk Havengebied: dezelfde opgave (een oude haven wordt woonwijk), maar dertig jaar later, met klimaatdoelen en autovrij maaiveld als nieuwe uitgangspunten.</p>\n<h3>Hoogtepunt 1 — Pontsteiger, Arons en Gelauff (2019)</h3>\n<p>Het beeldmerk van de wijk staat aan het einde van een pier van 200 meter in het IJ, op de plek van een pontsteiger die sinds de jaren 1950 in gebruik was. Arons en Gelauff combineerden <strong>twee U-vormige volumes</strong>: een liggende U rond een binnenhof, die overgaat in een staande U die een <strong>poort van 90 meter hoog</strong> vormt. Het gebouw telt <strong>366 woningen</strong> over 31 lagen (6 in het lage deel, 25 in de toren).</p>\n<p>De 'stoelvorm' is programmatisch: veel woningen onderaan en bovenaan, weinig in het slanke middendeel, omdat onderaan (aan het water) en bovenaan (met uitzicht) de meest gewilde woonplekken liggen. De brug wordt gedragen door <strong>stalen vakwerkliggers van twee verdiepingen hoog</strong>, die in de gevel zichtbaar zijn. Met 90 meter bleef het gebouw bewust lager dan de toegestane 145 meter, om aan te sluiten bij de bestaande bebouwing langs het IJ. Het volume is 7 meter opgetild, zodat eronder een publiek plein aan het water ontstaat.</p>\n<p>De gevel is bekleed met keramiek, speciaal ontwikkeld met <strong>Koninklijke Tichelaar Makkum</strong>, in zes steentinten die met het licht van kleur veranderen. De huurwoningen zitten in het U-vormige lage deel en de voet van de torens; de brug bevat uitsluitend koopwoningen, die door de maatwerkopties voor kopers grotendeels uniek zijn. Opdrachtgever was Ontwikkelingscombinatie Amsterdam Arche, uitgevoerd door Dura Vermeer en De Nijs.</p>\n<h3>Hoogtepunt 2 — Parkblok Houthaven, Studioninedots (2018)</h3>\n<p>Een vijfhoekig bouwblok met <strong>130 woningen</strong> voor Synchroon, verdeeld over vier gebouwen, met <strong>38 woningtypen in negen volumes</strong> die verschillen in vorm, articulatie en materiaal — van starterswoning tot ruime gezinswoning. Kenmerkend is de <strong>'Z-woning'</strong>: een woning over twee niveaus die via één gang wordt ontsloten, waardoor elke woning een gunstige zonoriëntatie en uitzicht krijgt. Parkeren en techniek zitten onder een verhoogd maaiveld, zodat entrees en woonruimtes aan de straat liggen. De binnenhof is een groene, collectieve tuin met slimme irrigatie. Het is een vroeg voorbeeld van de variatie-binnen-samenhang die Studioninedots later in Cityplot en Oostenburg verder uitwerkte.</p>\n<h3>Hoogtepunt 3 — Superlofts Houthaven, Marc Koehler (2016)</h3>\n<p>Het eerste gerealiseerde <strong>Superlofts</strong>-gebouw (met de Architekten Cie.). Bewoners kochten een casco van zes meter hoog en bepaalden zelf indeling, grootte en ontwerp. Lofts kunnen horizontaal en verticaal worden gestapeld. Het gebouw is in drie delen georganiseerd: laagbouw aan het water, een middendeel met parkeren en daktuinen, en hoogbouw achteraan. Dezelfde Koehler zagen we eerder vandaag bij Republica.</p>\n<h3>Hoogtepunt 4 — Het Schip, Michel de Klerk (1919–1921) — even omrijden</h3>\n<p>Op enkele honderden meters van de Houthavens ligt in de Spaarndammerbuurt <strong>Het Schip</strong> van Michel de Klerk, het icoon van de Amsterdamse School. Het is sociale woningbouw voor woningbouwvereniging Eigen Haard, met een postkantoor en een school, uitgevoerd als een baksteensculptuur met een torentje als 'mast'. Het was bedoeld als 'arbeiderspaleis': zorgvuldig gedetailleerde woningbouw voor arbeiders. Het contrast tussen Het Schip en de nieuwe Houthavens — honderd jaar Amsterdamse woningbouw in baksteen — is een mooie afsluiter van de reis.</p>\n<h3>Waarom interessant voor ons</h3>\n<p>De Houthavens zijn een staalkaart van hedendaagse Amsterdamse woningbouw op één plek: een iconische toren met een programmatische vorm, een bouwblok met extreme woningvariatie, een casco-concept voor zelfbouwers — en om de hoek het historische referentiepunt van de Amsterdamse School.</p>\n<h3>Om op te letten tijdens de doorrit</h3>\n<ul>\n<li>Het publieke plein onder Pontsteiger en de keramische gevel van dichtbij.</li>\n<li>De stalen vakwerkliggers in de gevel van de brug.</li>\n<li>De afwisseling in architectuur per eiland en de grachten als herinnering aan de oude havens.</li>\n<li>Het Schip: de metselwerkdetails, het torentje en de binnenhof.</li>\n</ul>\n<h3 class=\"src\">Bronnen en verder lezen</h3>\n<ul>\n<li><a href=\"https://arcam.nl/architectuur-gids/pontsteiger/\" target=\"_blank\" rel=\"noopener\">Arcam — Pontsteiger</a></li>\n<li><a href=\"https://www.architectuur.org/bouwwerk/787/Pontsteiger.html\" target=\"_blank\" rel=\"noopener\">Architectuurgids — Pontsteiger</a></li>\n<li><a href=\"https://arcam.nl/architectuur-gids/parkblok-houthaven/\" target=\"_blank\" rel=\"noopener\">Arcam — Parkblok Houthaven</a></li>\n<li><a href=\"https://arcam.nl/architectuur-gids/superlofts-houthaven/\" target=\"_blank\" rel=\"noopener\">Arcam — Superlofts Houthaven</a></li>\n<li><a href=\"https://pphp.nl/project/houthaven-amsterdam/\" target=\"_blank\" rel=\"noopener\">PPHP — Houthaven Amsterdam</a></li>\n<li><a href=\"https://www.hetschip.nl\" target=\"_blank\" rel=\"noopener\">Museum Het Schip</a></li>\n</ul>",

<script>
(function(){
const $=s=>document.querySelector(s), esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const state={view:'prog',day:null,proj:null};
const P={};PROJECTEN.forEach(p=>P[p.id]=p);
const dead=new Set();
const RS=(u,w)=>(!w||/images\.adsttc\.com/.test(u)&&w>500)?u:'https://wsrv.nl/?url='+encodeURIComponent(u)+'&w='+w+'&output=webp&q=80';
window.__imgerr=function(img){const o=img.dataset.o;if(o&&img.getAttribute('src')!==o){img.src=o;return;}dead.add(o);const b=img.closest('[data-img]');(b||img).remove();};
const imgTag=(src,cls,alt,w)=>`<img src="${esc(RS(src,w))}" data-o="${esc(src)}" alt="${esc(alt||'')}" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="__imgerr(this)"${cls?` class="${cls}"`:''}>`;
const photos=p=>(p.photos||[]).filter(u=>!dead.has(u));

/* ---------- time helpers ---------- */
const now=()=>{const q=new URLSearchParams(location.search).get('t');return q?new Date(q):new Date();};
function defaultDay(){const d=now();const iso=d.toISOString().slice(0,10);const m=PROGRAMMA.find(x=>x.datum===iso);return m?m.id:PROGRAMMA[0].id;}

/* ---------- surprise ---------- */
function unlock(){
  if(now()<new Date(VERRASSING.onthul))return null;
  try{const k='kt26-amsterdam-studiereis',b=atob(VERRASSING.data);let s='';for(let i=0;i<b.length;i++)s+=String.fromCharCode(b.charCodeAt(i)^k.charCodeAt(i%k.length));return JSON.parse(decodeURIComponent(escape(s)));}catch(e){return null}
}
function cdText(){const ms=new Date(VERRASSING.onthul)-now();if(ms<=0)return '00:00:00';const h=Math.floor(ms/36e5),m=Math.floor(ms%36e5/6e4),s=Math.floor(ms%6e4/1e3);const pad=n=>String(n).padStart(2,'0');return (h>47?Math.floor(h/24)+'d ':'')+pad(h>47?h%24:h)+':'+pad(m)+':'+pad(s);}
let cdTimer=null;

/* ---------- bike legs ---------- */
function fmtKm(m){return (m/1000).toFixed(1).replace('.',',')+' km'}
function fmtMin(s){const m=Math.round(s/60);return m<60?m+' min':Math.floor(m/60)+'u '+String(m%60).padStart(2,'0')}
function grp(s){return Math.ceil(s*1.2/60/5)*5*60}
function openVal(key){return CONFIG.open[key]||{}}
function stopPos(it){if(it.pos)return it.pos;if(it.open){const o=openVal(it.open);if(o.adres){const c=LS.get('geo:'+o.adres);if(c)return c;}}return null;}
function legsFor(day){
  const stops=day.items.filter(i=>i.stop);const out={};let prev=null,skipped=[];
  for(const it of stops){const pos=stopPos(it);
    if(!pos){skipped.push(it);continue;}
    if(prev){const key=prev.stop+'>'+it.stop;let r=RITTEN[key]||LS.get('route:'+key+':'+pos.join(','));
      out[it.stop]={key,r,from:prev,skipped:skipped.slice(),pending:!r};}
    prev=it;skipped=[];}
  return out;
}
async function geocode(addr){
  const c=LS.get('geo:'+addr);if(c)return c;
  try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(addr));const j=await r.json();if(j[0]){const p=[+j[0].lat,+j[0].lon];LS.set('geo:'+addr,p);return p;}}catch(e){}
  return null;
}
async function route(a,b){
  try{const r=await fetch(`https://routing.openstreetmap.de/routed-bike/route/v1/bike/${a[1]},${a[0]};${b[1]},${b[0]}?overview=false`);const j=await r.json();if(j.routes&&j.routes[0])return [Math.round(j.routes[0].distance),Math.round(j.routes[0].duration)];}catch(e){}
  return null;
}
async function fillLive(day){
  let changed=false;
  for(const it of day.items){if(it.stop&&!it.pos&&it.open){const o=openVal(it.open);if(o.adres&&!LS.get('geo:'+o.adres)){if(await geocode(o.adres))changed=true;}}}
  const L=legsFor(day);
  for(const k in L){const g=L[k];if(g.pending){const to=day.items.find(i=>i.stop===k);const r=await route(stopPos(g.from),stopPos(to));if(r){LS.set('route:'+g.key+':'+stopPos(to).join(','),r);changed=true;}}}
  if(changed&&state.view==='prog'&&state.day===day.id)render();
}

/* ---------- renderers ---------- */
function tagHtml(tags){if(!tags||!tags.length)return '';return '<div class="tags">'+tags.map(t=>{const c=/geleid/i.test(t)?'tag acc':(/nog|te reserveren/i.test(t)?'tag warn':'tag');return `<span class="${c}">${esc(t)}</span>`}).join('')+'</div>';}
function projThumbs(ids){let h='';ids.forEach(id=>{const p=P[id];if(!p)return;photos(p).slice(0,3).forEach(u=>h+=`<span data-img>${imgTag(u,'','',240)}</span>`)});return h?`<div class="plink">${h}</div>`:'';}
function mapsLink(q){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q)}
function itemHtml(it,day){
  if(it.verrassing)return surpriseHtml(it);
  const ids=it.project?[].concat(it.project):[];
  let titel=esc(it.titel),sub=it.sub?esc(it.sub):'',tags=(it.tags||[]).slice(),act=[];
  if(it.open){const o=openVal(it.open);
    titel=esc(it.titel)+(o.naam?' — '+esc(o.naam):'');
    sub=o.naam?esc(o.adres||''):'<span class="open">Nog in te vullen'+(o.opmerking?' ('+esc(o.opmerking)+')':'')+'</span>';
    if(o.status)tags.push(o.status);
    if(o.web)act.push(`<a href="${esc(o.web)}" target="_blank" rel="noopener">Website</a>`);
    if(o.adres)act.push(`<a href="${mapsLink(o.naam+', '+o.adres)}" target="_blank" rel="noopener">Route</a>`);}
  if(it.contact){const c=openVal(it.contact);
    sub+=(sub?'<br>':'')+'Contact: '+(c.persoon?esc(c.persoon)+(c.telefoon?' · <a href="tel:'+esc(c.telefoon.replace(/\s/g,''))+'">'+esc(c.telefoon)+'</a>':''):'<span class="open">nog in te vullen</span>');
    if(c.type)tags.push(c.type);}
  if(it.ref){const r=CONFIG[it.ref];if(r){if(r.telefoon)act.push(`<a href="tel:${esc(r.telefoon.replace(/\s/g,''))}">Bellen</a>`);if(r.web)act.push(`<a href="${esc(r.web)}" target="_blank" rel="noopener">Website</a>`);act.push(`<a href="${mapsLink(r.naam+', '+r.adres)}" target="_blank" rel="noopener">Route</a>`);if(r.status)tags.push(r.status);}}
  if(it.web)act.push(`<a href="${esc(it.web)}" target="_blank" rel="noopener">Website</a>`);
  if(it.adres)act.push(`<a href="${mapsLink(it.adres)}" target="_blank" rel="noopener">Route</a>`);
  if(it.wagens)sub+=CONFIG.wagens.map(w=>`<div class="cars"><b>${esc(w.naam)}</b> — ${esc(w.inzittenden)}</div>`).join('');
  let more='';if(ids.length)more=ids.map(id=>P[id]?`<button class="more" data-p="${id}">Fiche ${esc(P[id].short||P[id].titel)}</button>`:'').join(' &nbsp; ');
  const cls='it'+(it.type==='reis'?' reis':'')+(it.klein?' klein':'');
  return `<div class="${cls}"><div class="t">${esc(it.tijd||'')}</div><div><div class="ti">${titel}</div>${sub?`<div class="ts">${sub}</div>`:''}${tagHtml(tags)}${projThumbs(ids)}${more?'<div>'+more+'</div>':''}${act.length?`<div class="act">${act.join('')}</div>`:''}</div></div>`;
}
function surpriseHtml(it){
  const s=unlock();
  if(!s)return `<div class="it"><div class="t">${esc(it.tijd)}</div><div><div class="lock"><div class="ti">Programmaonderdeel</div><div class="ts">Wordt onthuld op woensdag om 09:40</div><div class="cd" id="cd">${cdText()}</div></div></div></div>`;
  return `<div class="it"><div class="t">${esc(it.tijd)}</div><div><div class="reveal"><div class="kicker">Onthuld</div><div class="ti" style="margin-top:6px">${esc(s.titel)}</div><div class="ts">${esc(s.plaats)}</div><div class="body" style="padding:10px 0 0;font-size:14.5px">${s.tekst.map(t=>'<p>'+esc(t)+'</p>').join('')}</div><div class="act"><a href="${esc(s.web)}" target="_blank" rel="noopener">${esc(s.webLabel)}</a><a href="${mapsLink(s.plaats)}" target="_blank" rel="noopener">Route</a></div></div></div></div>`;
}
function bikeHtml(g){
  if(!g)return '';const r=g.r;
  let via=g.skipped.length?' <em>· via '+g.skipped.map(s=>(s.open&&openVal(s.open).naam)||s.titel.toLowerCase()).join(', ')+': nog te bepalen</em>':'';
  if(!r)return `<div class="bike"><div><div class="l"></div></div><div class="v"><em>Fietsrit wordt berekend…</em></div></div>`;
  const walk=r[0]<300;
  return `<div class="bike"><div><div class="l"></div></div><div class="v">${walk?'Te voet · '+r[0]+' m':fmtKm(r[0])+' · '+fmtMin(r[1])+' <em>(groep ±'+fmtMin(grp(r[1]))+')</em>'}${r[2]?' · '+esc(r[2]):''}${via}</div></div>`;
}
function renderDay(){
  const day=PROGRAMMA.find(d=>d.id===state.day);const L=day.fiets?legsFor(day):{};
  let km=0,sec=0,np=0,pend=false;for(const k in L){if(L[k].r){km+=L[k].r[0];sec+=L[k].r[1];}else pend=true;}
  day.items.forEach(i=>{if(i.project)np+=[].concat(i.project).length});
  let h=`<section class="day"><div class="kicker">${esc(day.kicker)}</div><h1>${esc(day.titel)}</h1>`;
  if(day.fiets)h+=`<div class="dsum"><div>Fietsen<strong>${fmtKm(km)}</strong></div><div>Fietstijd<strong>${fmtMin(sec)}</strong></div><div>Projecten<strong>${np}</strong></div></div><p class="note">Fietstijd volgens de OpenStreetMap-fietsrouteplanner. Tussen haakjes: met 20% marge voor de groep, afgerond. Wachttijd aan de pont niet inbegrepen.${pend?' Sommige ritten zijn nog niet bekend.':''}</p>`;
  else h+=`<div class="dsum"><div>Vervoer<strong>${day.id==='wo'?'Wagens':'Wagens'}</strong></div><div>Hotel<strong>NDSM</strong></div><div>Projecten<strong>${np}</strong></div></div>`;
  h+='</section><section class="tl">';
  day.items.forEach(it=>{if(it.stop&&L[it.stop])h+=bikeHtml(L[it.stop]);h+=itemHtml(it,day);});
  h+='</section>';return h;
}
function renderProjects(){
  let h='<div class="ph1"><div class="kicker">Projecten</div><h1>Alle fiches</h1></div><div class="plist">';
  PROGRAMMA.forEach(d=>{const ids=[];d.items.forEach(i=>i.project&&[].concat(i.project).forEach(x=>ids.includes(x)||ids.push(x)));if(!ids.length)return;
    h+=`<div class="pgroup">${esc(d.kort)} — ${esc(d.label)}</div>`;
    ids.forEach(id=>{const p=P[id];if(!p)return;const f=photos(p)[0];h+=`<button class="prow" data-p="${id}">${f?`<span data-img>${imgTag(f,'','',300)}</span>`:'<i></i>'}<div><div class="ti">${esc(p.titel)}</div><div class="ts">${esc(p.arch)}</div>${p.tag?`<div class="tags"><span class="tag${/geleid/i.test(p.tag)?' acc':''}">${esc(p.tag)}</span></div>`:''}</div></button>`;});});
  return h+'</div>';
}
let seg='f';
function renderProject(){
  const p=P[state.proj];const ph=photos(p);const hero=ph[0];
  let h=`<div class="hero">${hero?imgTag(hero,'','',1200).replace('onerror="__imgerr(this)"','onerror="if(this.src!==this.dataset.o){this.src=this.dataset.o}else{this.remove()}"'):''}<button class="back" id="back">← Terug</button>${ph.length?`<span class="n">${ph.length} foto's · ${(p.plans||[]).length} plannen</span>`:''}</div>`;
  h+=`<div class="pj"><div class="kicker">${esc(p.kicker)}</div><h2>${esc(p.titel)}</h2><div class="arch">${esc(p.arch)}</div>
   <div class="seg"><button data-s="f" class="${seg==='f'?'on':''}">Foto's</button><button data-s="p" class="${seg==='p'?'on':''}" ${(p.plans||[]).length?'':'disabled'}>Plannen</button><button data-s="k" class="${seg==='k'?'on':''}">Kaart</button></div></div>`;
  if(seg==='f')h+=`<div class="strip">${ph.map((u,i)=>`<button data-img data-lb="f" data-i="${i}">${imgTag(u,'','',520)}</button>`).join('')}</div>`;
  if(seg==='p')h+=`<div class="strip plans">${(p.plans||[]).map((x,i)=>`<button data-img data-lb="p" data-i="${i}">${imgTag(x[0],'',x[1],520)}</button>`).join('')}</div>`;
  if(seg==='k')h+=`<div class="mapbox"><iframe loading="lazy" src="https://www.google.com/maps?q=${p.pos[0]},${p.pos[1]}&z=16&output=embed"></iframe></div><div class="act" style="padding:10px 20px 0"><a href="https://www.google.com/maps/search/?api=1&query=${p.pos[0]},${p.pos[1]}" target="_blank" rel="noopener">Openen in Google Maps</a></div>`;
  if(seg!=='k')h+=`<div class="credit">Beeld: ${esc(p.credit)}</div>`;
  if(p.data&&p.data.length)h+=`<dl class="data">${p.data.map(r=>`<div><dt>${esc(r[0])}</dt><dd>${r[1]}</dd></div>`).join('')}</dl>`;
  h+=`<article class="body">${p.html}</article>`;
  return h;
}
function renderMap(){return `<div class="fullmap"><iframe src="https://www.google.com/maps/d/embed?mid=${CONFIG.myMapsId}" loading="lazy"></iframe></div><div class="act" style="padding:12px 20px"><a href="https://www.google.com/maps/d/viewer?mid=${CONFIG.myMapsId}" target="_blank" rel="noopener">Openen in Google My Maps</a></div>`;}
function renderInfo(){
  const c=CONFIG;let h='<div class="ph1"><div class="kicker">Info</div><h1>Praktisch</h1></div>';
  h+='<div class="sec"><h3>Deelnemers en wagens</h3>'+c.wagens.map(w=>`<div class="row"><div class="ti">${esc(w.naam)}</div><div class="ts">${esc(w.inzittenden)}</div></div>`).join('')+'</div>';
  const blk=(t,r)=>`<div class="row"><div class="ti">${esc(r.naam)}</div><div class="ts">${esc(r.adres||'')}${r.telefoon?'<br><a href="tel:'+esc(r.telefoon.replace(/\s/g,''))+'">'+esc(r.telefoon)+'</a>':''}${r.status?' · '+esc(r.status):''}</div><div class="act">${r.web?`<a href="${esc(r.web)}" target="_blank" rel="noopener">Website</a>`:''}${r.adres?`<a href="${mapsLink(r.naam+', '+r.adres)}" target="_blank" rel="noopener">Route</a>`:''}</div></div>`;
  h+='<div class="sec"><h3>Verblijf en vervoer</h3>'+blk('Hotel',c.hotel)+blk('Fietsen',c.fietsen)+blk('Gids',c.gids)+'</div>';
  const o=c.open,lab={lunchDonderdag:'Lunch donderdag',dinerDonderdag:'Diner donderdag',lunchVrijdag:'Lunch vrijdag',dinerVrijdag:'Diner vrijdag',contactWestbeat:'Contact Westbeat',contactCornelis:'Contact Cornelis',contactXplore:'Contact Xplore'};
  h+='<div class="sec"><h3>Nog open</h3>'+Object.keys(o).map(k=>{const v=o[k];const val=v.naam||v.persoon;return `<div class="row"><div class="ts" style="font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase">${esc(lab[k]||k)}</div><div class="ti" style="margin-top:3px">${val?esc(val):'<span class="open" style="font-weight:400">Nog in te vullen</span>'}</div>${v.status||v.type?`<div class="ts">${esc(v.status||v.type)}</div>`:''}</div>`}).join('')+'</div>';
  h+='<div class="sec"><h3>Nuttig</h3><div class="row"><div class="ti">Noodnummer</div><div class="ts"><a href="tel:112">112</a> — politie, brandweer, ambulance</div></div><div class="row"><div class="ti">Pont over het IJ</div><div class="ts">Gratis voor fietsers. NDSM – Centraal, Houthavens – NDSM en Buiksloterweg – Centraal varen frequent; reken op enkele minuten wachttijd.</div><div class="act"><a href="https://www.gvb.nl/reizen/veren" target="_blank" rel="noopener">Vaartijden GVB</a></div></div><div class="row"><div class="ti">Fietstijden</div><div class="ts">Berekend met de OpenStreetMap-fietsrouteplanner. De groepstijd rekent 20% extra, afgerond op 5 minuten.</div></div></div>';
  h+='<div class="sec"><h3>Over deze app</h3><div class="row"><div class="ts">Teksten: samenvatting van vakbronnen (Arcam, Archined, ArchDaily, Dezeen, Designboom, Architectenweb, De Architect en de websites van de bureaus), telkens vermeld per fiche. Beelden worden rechtstreeks van de bron geladen; alle rechten bij de vermelde fotografen en bureaus. Enkel voor intern gebruik tijdens de studiereis.</div></div></div>';
  return h;
}
function render(){
  clearInterval(cdTimer);
  const hdr=$('#hdr');hdr.classList.toggle('noday',state.view!=='prog');
  $('#meta').textContent=CONFIG.periode;
  $('#tabs').innerHTML=PROGRAMMA.map(d=>`<button class="tab${d.id===state.day?' on':''}" data-d="${d.id}"><b>${esc(d.kort)}</b>${esc(d.label)}</button>`).join('');
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===(state.view==='p'?'proj':state.view)));
  let h='';
  if(state.view==='prog')h=renderDay();else if(state.view==='proj')h=renderProjects();else if(state.view==='p')h=renderProject();else if(state.view==='kaart')h=renderMap();else h=renderInfo();
  $('#main').innerHTML=h;
  if($('#cd'))cdTimer=setInterval(()=>{const e=$('#cd');if(!e){clearInterval(cdTimer);return;}if(unlock()){render();return;}e.textContent=cdText();},1000);
  if(state.view==='prog'){const d=PROGRAMMA.find(x=>x.id===state.day);if(d.fiets)fillLive(d);}
}
function go(view,extra){Object.assign(state,{view},extra||{});if(view==='p')seg='f';
  const hash=view==='prog'?'#'+state.day:view==='p'?'#p/'+state.proj:'#'+view;if(location.hash!==hash)history.pushState(null,'',hash);
  render();window.scrollTo(0,0);LS.set('state',{view:state.view==='p'?'proj':state.view,day:state.day});}
function fromHash(){const h=location.hash.slice(1);
  if(h.startsWith('p/')&&P[h.slice(2)]){state.view='p';state.proj=h.slice(2);}
  else if(PROGRAMMA.find(d=>d.id===h)){state.view='prog';state.day=h;}
  else if(['proj','kaart','info'].includes(h))state.view=h;
  else{state.view='prog';}
  if(!state.day)state.day=defaultDay();}
/* lightbox */
function openLb(kind,idx){const p=P[state.proj];const list=kind==='f'?photos(p).map(u=>[u,'']):(p.plans||[]).filter(x=>!dead.has(x[0]));
  $('#lbs').innerHTML=list.map(x=>`<figure class="${kind==='p'?'plan':''}"><img src="${esc(RS(x[0],kind==='p'?2000:1600))}" data-o="${esc(x[0])}" onerror="if(this.src!==this.dataset.o)this.src=this.dataset.o" referrerpolicy="no-referrer" alt="">${x[1]?`<figcaption>${esc(x[1])}</figcaption>`:''}</figure>`).join('');
  $('#lbc').textContent='Beeld: '+p.credit;$('#lb').classList.add('on');document.body.style.overflow='hidden';
  const sl=$('#lbs');const upd=()=>{$('#lbn').textContent=(Math.round(sl.scrollLeft/sl.clientWidth)+1)+' / '+list.length};
  requestAnimationFrame(()=>{sl.scrollLeft=idx*sl.clientWidth;upd();});sl.onscroll=upd;}
function closeLb(){$('#lb').classList.remove('on');document.body.style.overflow='';}
document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-p]');if(!t)return;
  if(t.id==='lbx')return closeLb();
  if(t.dataset.v)return go(t.dataset.v);
  if(t.dataset.d)return go('prog',{day:t.dataset.d});
  if(t.dataset.p)return go('p',{proj:t.dataset.p});
  if(t.id==='back')return history.length>1?history.back():go('proj');
  if(t.dataset.s){seg=t.dataset.s;render();return;}
  if(t.dataset.lb)return openLb(t.dataset.lb,+t.dataset.i);
});
window.addEventListener('popstate',()=>{closeLb();fromHash();render();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLb();});
fromHash();render();
})();
</script>
</body>
</html>
