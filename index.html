<style>
:root{
  --bg:#FFFFFF; --bg2:#F4F3F0; --ink:#141414; --ink2:#5E5E5A; --ink3:#9A9A94;
  --line:#E4E2DC; --accent:#C2412D; --ph:#E7E5E0;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111111; --bg2:#1A1A1A; --ink:#EFEEEA; --ink2:#A9A8A3; --ink3:#6F6E6A; --line:#2B2B2A; --accent:#E0654F; --ph:#232322;}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.45}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{max-width:720px;margin:0 auto}
/* header */
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding-top:var(--safe-t)}
.hd{display:flex;justify-content:space-between;align-items:baseline;padding:16px 20px 0}
.brand{font-weight:700;font-size:15px;letter-spacing:.01em}.brand span{color:var(--accent)}
.meta{font-family:var(--mono);font-size:11px;color:var(--ink3)}
.tabs{display:flex;padding:0 20px;margin-top:12px}
.tab{flex:1;min-width:0;text-align:left;padding:8px 6px 11px 0;font-size:12px;color:var(--ink3);border-bottom:2px solid transparent;line-height:1.25}
.tab b{display:block;font-family:var(--mono);font-weight:500;font-size:11px;letter-spacing:.04em}
.tab.on{color:var(--ink);border-color:var(--ink)}
header.noday .tabs{display:none}
main{padding-bottom:calc(80px + var(--safe-b))}
/* day */
.day{padding:26px 20px 6px}
.kicker{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
h1{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.08;margin-top:8px}
.dsum{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:20px}
.dsum div{padding:10px 0;font-family:var(--mono);font-size:10.5px;letter-spacing:.03em;color:var(--ink3)}
.dsum div+div{border-left:1px solid var(--line);padding-left:12px}
.dsum strong{display:block;font-family:var(--sans);font-size:18px;letter-spacing:-.01em;color:var(--ink);font-weight:600;margin-top:2px}
.note{font-size:12px;color:var(--ink3);margin-top:8px;line-height:1.4}
.tl{padding:6px 20px 30px}
.it{display:grid;grid-template-columns:62px minmax(0,1fr);gap:12px;padding:15px 0;border-bottom:1px solid var(--line)}
.it.reis .ti{font-weight:500;color:var(--ink2);font-size:14px}
.it.klein{padding:10px 0}.it.klein .ti{font-size:13px;font-weight:500;color:var(--ink2)}
.t{font-family:var(--mono);font-size:11.5px;color:var(--ink2);padding-top:3px;line-height:1.35}
.ti{font-size:16px;font-weight:600;line-height:1.3}
.ts{font-size:13.5px;color:var(--ink2);margin-top:3px;line-height:1.45}
.open{color:var(--ink3);font-style:italic}
.tags{margin-top:8px;display:flex;flex-wrap:wrap;gap:5px}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:3px 6px;border:1px solid var(--line);color:var(--ink2)}
.tag.acc{border-color:var(--accent);color:var(--accent)}
.tag.warn{border-color:var(--ink3);color:var(--ink3);border-style:dashed}
.plink{display:flex;gap:6px;margin-top:10px;overflow:hidden}
.plink img,.plink i{width:74px;height:54px;object-fit:cover;background:var(--ph);display:block;flex:0 0 auto}
.more{display:inline-block;margin-top:9px;font-size:12.5px;font-weight:600;border-bottom:1px solid var(--ink);padding-bottom:1px}
.act{margin-top:9px;display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px}
.act a{color:var(--ink2);text-decoration:none;border-bottom:1px solid var(--line)}
.bike{display:grid;grid-template-columns:62px minmax(0,1fr);gap:12px;padding:7px 0;border-bottom:1px solid var(--line)}
.bike .l{border-left:1px dashed var(--ink3);margin-left:12px;height:100%;min-height:18px}
.bike .v{font-family:var(--mono);font-size:11px;color:var(--ink2);line-height:1.5}
.bike .v em{font-style:normal;color:var(--ink3)}
.cars{margin-top:8px;font-size:13px;color:var(--ink2)}.cars b{color:var(--ink);font-weight:600}
/* surprise */
.lock{border:1px solid var(--ink);padding:14px 14px 13px}
.lock .ti{font-size:15px}.cd{font-family:var(--mono);font-size:22px;font-weight:500;letter-spacing:.02em;margin-top:8px}
.reveal{border:1px solid var(--accent);padding:14px}
.reveal .ti{font-size:18px}
/* list of projects */
.plist{padding:10px 20px 30px}
.pgroup{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);padding:22px 0 8px;border-bottom:1px solid var(--ink)}
.prow{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;padding:14px 0;border-bottom:1px solid var(--line);text-decoration:none;text-align:left;width:100%}
.prow img,.prow i{width:96px;height:72px;object-fit:cover;background:var(--ph);display:block}
.prow .ti{font-size:15.5px}
.ph1{padding:26px 20px 4px}
/* project */
.hero{position:relative;background:var(--ph);aspect-ratio:4/3;max-height:62vh;width:100%;overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.back{position:absolute;left:12px;top:12px;font-family:var(--mono);font-size:11px;background:var(--bg);padding:6px 9px}
.hero .n{position:absolute;right:12px;bottom:10px;font-family:var(--mono);font-size:10px;color:var(--ink2);background:var(--bg);padding:3px 6px}
.pj{padding:22px 20px 0}
h2{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin-top:8px}
.arch{font-size:14px;color:var(--ink2);margin-top:6px}
.seg{display:flex;border:1px solid var(--ink);margin-top:20px}
.seg button{flex:1;text-align:center;font-size:12.5px;padding:9px 0;font-weight:500}
.seg button.on{background:var(--ink);color:var(--bg)}
.seg button:disabled{color:var(--ink3)}
.strip{display:flex;gap:6px;overflow-x:auto;padding:12px 20px 0;scroll-snap-type:x mandatory;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip button{flex:0 0 auto;scroll-snap-align:start;padding:0}
.strip img{height:132px;width:auto;min-width:90px;max-width:260px;object-fit:cover;display:block;background:var(--ph)}
.strip.plans img{background:#fff;object-fit:contain;border:1px solid var(--line);padding:4px;height:150px}
.credit{font-family:var(--mono);font-size:10px;color:var(--ink3);padding:8px 20px 0;letter-spacing:.02em}
.mapbox{margin:12px 20px 0;border:1px solid var(--line)}
.mapbox iframe{display:block;width:100%;height:260px;border:0}
.data{margin:22px 20px 0;border-top:1px solid var(--ink)}
.data div{display:grid;grid-template-columns:118px minmax(0,1fr);gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px;line-height:1.4}
.data dt{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);padding-top:2px}
.body{padding:10px 20px 0;font-size:15.5px;line-height:1.62;max-width:680px}
.body h3{font-size:11.5px;font-family:var(--mono);font-weight:500;letter-spacing:.09em;text-transform:uppercase;margin:28px 0 8px;color:var(--ink2)}
.body h3:first-child{margin-top:18px}
.body p{margin:0 0 12px}.body ul,.body ol{margin:0 0 12px 18px}.body li{margin:0 0 6px}
.body strong{font-weight:600}
.body blockquote{border-left:2px solid var(--accent);padding:4px 0 4px 14px;margin:14px 0;color:var(--ink)}
.body a{text-decoration:none;border-bottom:1px solid var(--line)}
.body h3.src + ul{list-style:none;margin-left:0}
.body h3.src + ul li{border-bottom:1px solid var(--line);padding:7px 0;margin:0;font-size:14px}
.body h3.src + ul a{border:0}
.body h3.src + ul a:after{content:"  ↗";color:var(--ink3);font-family:var(--mono);font-size:11px}
.body table{display:none}
/* info */
.sec{padding:0 20px}
.sec h3{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);padding:24px 0 8px;border-bottom:1px solid var(--ink);font-weight:500}
.row{padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.row .ti{font-size:14.5px}
.fullmap{height:calc(100vh - 160px);height:calc(100dvh - 150px - var(--safe-b));border-bottom:1px solid var(--line)}
.fullmap iframe{width:100%;height:100%;border:0;display:block}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
nav .wrap{display:flex}
nav button{flex:1;padding:11px 0 13px;font-size:11px;color:var(--ink3);font-weight:500}
nav button:before{content:"";display:block;width:18px;height:2px;margin:0 auto 7px;background:transparent}
nav button.on{color:var(--ink)}nav button.on:before{background:var(--ink)}
/* lightbox */
.lb{position:fixed;inset:0;z-index:50;background:#000;display:none;flex-direction:column}
.lb.on{display:flex}
.lb-top{display:flex;justify-content:space-between;align-items:center;padding:calc(10px + var(--safe-t)) 14px 10px;color:#ddd;font-family:var(--mono);font-size:11px}
.lb-top button{color:#fff;font-family:var(--mono);font-size:12px;border:1px solid #555;padding:6px 10px}
.lb-sl{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.lb-sl::-webkit-scrollbar{display:none}
.lb-sl figure{flex:0 0 100%;scroll-snap-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center;overflow:auto;touch-action:pan-x pan-y pinch-zoom}
.lb-sl img{max-width:100%;max-height:calc(100vh - 110px);object-fit:contain}
.lb-sl figure.plan img{background:#fff}
.lb-sl figcaption{color:#bbb;font-size:12px;padding:8px 14px 0;text-align:center}
.lb-bot{padding:8px 14px calc(12px + var(--safe-b));color:#888;font-family:var(--mono);font-size:10px;text-align:center}
.hide{display:none!important}
</style>
</head>

"html": "<h3>Context: een deltanatuur die terugkeert</h3>\n<p>Tij staat in De Scheelhoek, een natuurgebied van Natuurmonumenten net achter de Haringvlietdam bij Stellendam. Sinds de afsluiting van het Haringvliet in 1970 was hier van getijdenwerking nauwelijks nog sprake: de Deltawerken maakten van het estuarium een zoetwaterbekken. Met het zogenaamde Kierbesluit werden de Haringvlietsluizen in november 2018 voor het eerst weer op een kier gezet, zodat zout water en trekvissen zoals zalm, zeeforel en paling opnieuw kunnen binnendringen.</p>\n<p>Het observatorium is het meest zichtbare onderdeel van het Droomfondsproject Haringvliet: een samenwerking van zes natuurorganisaties (ARK Natuurontwikkeling, Natuurmonumenten, Staatsbosbeheer, Sportvisserij Nederland, Vogelbescherming Nederland en het Wereld Natuur Fonds), gefinancierd met een Droomfonds-bijdrage van €13,5 miljoen van de Nationale Postcode Loterij, verdubbeld door regionale partners. Het totale project herstelde zo'n 100 hectare brakwaternatuur en creëerde 230 hectare nieuwe deltanatuur, waaronder het eiland Bliek. De Scheelhoek kreeg nieuwe broedeilanden, waar duizenden grote sterns broeden. Die broedkolonie is precies wat je vanuit Tij bekijkt.</p>\n<h3>Concept: 't ei</h3>\n<p>De naam werd gekozen uit meer dan 700 inzendingen van omwonenden en werkt op twee niveaus. <em>Tij</em> verwijst naar het getij dat terugkeert; snel uitgesproken klinkt het als <em>'t ei</em>. De vorm is immers een vergroot ei van de grote stern, de soort die symbool staat voor dit gebied. Het gebouw is daarmee eerder een landschapsobject dan een klassieke vogelkijkhut: RAU spreekt van het grootste en meest uitgesproken 'natuurkunstwerk' van het Haringvliet.</p>\n<p>Het ei ligt niet los in het landschap maar in een 'nest' dat H+N+S ontwierp: een omkadering van riet, kastanjehouten palen en zand, met een lage omheining van gevlochten takken. De bezoeker nadert via een route door verschillende vogelhabitats en betreedt het gebouw niet via een voordeur, maar via een tunnel.</p>\n<h3>De tunnel</h3>\n<p>De toegang is een half ingegraven tunnel, opgebouwd uit hergebruikte meerpalen en damwanden en afgedekt met zand. Zo blijft de bezoeker onzichtbaar voor de vogels. In de zandige flank van de tunnel zijn nestgaten voor oeverzwaluwen voorzien: de toegangsconstructie is zelf habitat. Het is een mooi voorbeeld van hoe het ontwerp functionele eisen (niet verstoren), circulariteit (hergebruikte havenonderdelen) en ecologie (nestwand) in één element samenbrengt.</p>\n<h3>Constructie: een parametrische Zollinger</h3>\n<p>Het hart van het project is de houtconstructie. Het ei is opgebouwd als een <strong>Zollinger-structuur</strong>: een ruitvormig raster van korte, identieke balkjes die elkaar onderling ondersteunen. Het principe werd in de jaren 1920 door de Duitse stadsbouwmeester Friedrich Zollinger ontwikkeld om met kleine, goedkope houtsecties grote overspanningen te maken. Hier wordt het systeem toegepast op een dubbelgekromde eivorm, wat enkel mogelijk is met parametrisch ontwerp: elke staaf en elke knoop is uniek.</p>\n<p>Het model werd opgezet door het Finse Geometria, met constructief ontwerp door onderzoekers van Aalto University. De productiedata werden rechtstreeks uit het 3D-model gehaald — een <em>file-to-factory</em>-proces. In Finland werden zo'n 400 onderdelen gefreesd, naar Stellendam verscheept en ter plaatse als een bouwpakket gemonteerd. Alle verbindingen zijn houtverbindingen, zonder metalen connectoren.</p>\n<p>De materialisatie volgt het water. Het onderste deel, dat bij hoogwater kan onderlopen, is in gelamineerd Accoya uitgevoerd — geacetyleerd hout dat nauwelijks water opneemt en niet rot. Daarboven gaat de constructie over in gelamineerd grenen. De binnenring, een verhoogde ronde loopbrug van waaruit je rondom kijkt, is gemaakt van staal en CLT. De vloer is een hybride hout-betonvloer.</p>\n<h3>Huid: riet uit het eigen gebied</h3>\n<p>De bovenste schil is bekleed met riet dat in het natuurgebied zelf werd gesneden. Het riet stopt net boven de maximale waterlijn en laat aan de top het houtskelet vrij, rond een grote opening die daglicht naar binnen brengt. Aan weerszijden zitten kijkopeningen op ooghoogte, gericht op de broedeilanden, de Haringvlietdam en de wijde delta.</p>\n<p>Het gebruik van riet is meer dan een verwijzing naar de lokale bouwtraditie: het is ook camouflage, isolatie en een materiaal dat na gebruik volledig terug de kringloop in kan.</p>\n<h3>Circulair en demonteerbaar</h3>\n<p>Thomas Rau is een van de bekendste stemmen in het Nederlandse circulaire bouwen (hij stond mee aan de wieg van het materialenpaspoort en het platform Madaster). Tij is daar een schoolvoorbeeld van: met uitzondering van de hybride vloer is het hele gebouw demonteerbaar zonder waardeverlies. De onderdelen zijn genummerd, gedocumenteerd in het digitale model en kunnen elders opnieuw opgebouwd of hergebruikt worden. Het gebouw is zo ontworpen dat het de plek later weer kan verlaten zonder sporen na te laten — een logische houding in een natuurgebied dat zelf in volle transformatie is.</p>\n<h3>Waarom interessant voor ons</h3>\n<p>Tij is een compact project waarin veel actuele thema's samenkomen: digitale fabricage in hout, circulariteit als ontwerpuitgangspunt, landschap en gebouw als één geheel, en een publieke opdracht gefinancierd vanuit een natuurcoalitie. Voor een bureau dat op gebouwschaal werkt, is het vooral interessant hoe één helder concept (het ei) consequent doorgezet wordt tot in constructie, materiaal en route.</p>\n<h3>Om op te letten ter plaatse</h3>\n<ul>\n<li>De overgang van riet naar zichtbaar Zollinger-raster in de top, rond het lichtoculus.</li>\n<li>De materiaalgrens Accoya / grenen ter hoogte van de hoogwaterlijn.</li>\n<li>De houtverbindingen zonder staal, en hoe de unieke staven op elkaar aansluiten.</li>\n<li>De tunnel als drempel tussen landschap en gebouw, met de oeverzwaluwwand.</li>\n<li>De ringloop en de oriëntatie van de kijkopeningen op broedeilanden en dam.</li>\n<li>Het 'nest' van H+N+S: riet, kastanjepalen, zand en takkenhaag.</li>\n</ul>\n<h3 class=\"src\">Bronnen en verder lezen</h3>\n<ul>\n<li><a href=\"https://www.rau.eu/portfolio/het-nest/\" target=\"_blank\" rel=\"noopener\">RAU Architects — TIJ</a></li>\n<li><a href=\"https://www.archdaily.com/915456/tij-observatory-ro-and-ad-architecten\" target=\"_blank\" rel=\"noopener\">ArchDaily — Tij Observatory</a></li>\n<li><a href=\"https://www.dezeen.com/2019/05/11/tij-bird-observatory-rau-architects-scheelhoek-nature-reserve/\" target=\"_blank\" rel=\"noopener\">Dezeen — Thatched reeds cover egg-shaped Tij Observatory</a></li>\n<li><a href=\"https://architectenweb.nl/nieuws/artikel.aspx?ID=45892\" target=\"_blank\" rel=\"noopener\">Architectenweb — Parametrisch en duurzaam ontworpen vogelei</a></li>\n<li><a href=\"https://geometria.fi/project/tij-bird-observatory/\" target=\"_blank\" rel=\"noopener\">Geometria — TIJ bird observatory</a></li>\n<li><a href=\"https://www.vogelbescherming.nl/actueel/bericht/opening-spectaculair-vogelobservatorium-tij-brengt-deltanatuur-haringvliet-dichtbij\" target=\"_blank\" rel=\"noopener\">Vogelbescherming — Opening vogelobservatorium Tij</a></li>\n<li><a href=\"https://www.natuurmonumenten.nl/natuurgebieden/scheelhoek/vogelkijkpunten/vogelobservatorium-tij\" target=\"_blank\" rel=\"noopener\">Natuurmonumenten — praktische info</a></li>\n<li>Video: <a href=\"https://www.youtube.com/watch?v=WF-E7V2WDyU\" target=\"_blank\" rel=\"noopener\">ArchDaily × Spirit of Space</a></li>\n</ul>",

"html": "<h3>Van scheepswerf tot broedplaats</h3>\n<p>De Nederlandsche Scheepsbouw Maatschappij (NSM) bouwde vanaf 1919–1920 haar grote scheepsbouwloods op de noordoever van het IJ, naar ontwerp van A.E.G. en J.D. Postma: een hal met bakstenen gevels, een stalen skelet, hoge blauwe deuren en smalle, hoge ramen, met zes lengtebeuken en een dwarsbeuk met een mallenzolder. In 1946 fuseerde NSM met de Nederlandsche Dok Maatschappij tot de NDSM, die uitgroeide tot een van de grootste en modernste scheepswerven ter wereld. Op de hellingen werden tankers en vrachtschepen gebouwd; de betonnen kraanbaan uit 1952 (ook van Postma) droeg de kranen van de assemblagedok. Oliecrisis, politieke keuzes en Aziatische concurrentie maakten in 1984 een einde aan de werf.</p>\n<p>In de jaren 1990 raakte het terrein in verval en trokken kunstenaars, ambachtslieden en theatermakers de lege gebouwen in. In 1999 schreef stadsdeel Noord een ideeënprijsvraag uit voor een nieuw gebruik. De werkgroep <strong>Kinetisch Noord</strong> — een samenwerking tussen bestaande broedplaatsen zoals de Houtkoper, de Graansilo, Vrieshuis Amerika en het Werkgebouwengilde — won met een plan dat nog volop naar de squat-cultuur rook: een skatehal, een kunstenaarsdorp van strobalen en containers, theaterwerkplaatsen, een beeldentuin, een manifestatiehal en zelfs een robotgestuurd pretpark van kunstenaar Jim Whiting. Het ging aanvankelijk om een tijdelijke bestemming van vijf tot tien jaar.</p>\n<h3>Kunststad: interieurstedenbouw</h3>\n<p>Dat tijdelijke bleek blijvend. De sleutelingreep werd <strong>Kunststad</strong> in de scheepsbouwloods, ontworpen door <strong>Dynamo Architecten</strong> (Peter de Bruin, Charlotte Ernst, Edo Keijzer), gerealiseerd tussen 2004 en 2007. Het project is een schoolvoorbeeld van het Amsterdamse <em>broedplaatsenbeleid</em>, dat bewust goedkope werkruimte voorziet voor creatieven om gebieden in transformatie te activeren.</p>\n<p>Dynamo sprak van <strong>'interieurstedenbouw'</strong>: in plaats van de hal op te vullen met een afgewerkt gebouw, plaatsten ze in de loods een stalen casco met binnenstraten, pleintjes en doorzichten. De gebruikers bouwden daarin zelf hun ateliers en werkplaatsen af. Het resultaat is een 'stad in de loods' van ongeveer 7.000 m², met zo'n 85 ateliers en ongeveer 250 gebruikers: kunstenaars, ontwerpers en ambachtslieden. De rest van de loods blijft vrij voor filmopnames, voorstellingen, tentoonstellingen en evenementen. Het principe — de overheid of initiatiefnemer levert een robuust casco, de gebruiker vult in — is sindsdien vaak gekopieerd.</p>\n<h3>Kraanspoor: licht op een oude kraanbaan</h3>\n<p>Aan de westkant van de werf ligt <strong>Kraanspoor</strong> van <strong>OTH (Ontwerpgroep Trude Hooykaas)</strong>, opgeleverd in 2007 voor ING Real Estate Development. Na de sluiting was sloop van de kraanbaan al vergund; in plaats daarvan werd de 270 meter lange betonnen baan de fundering voor een nieuw kantoorgebouw van drie lagen, 13,8 meter breed en 10 meter hoog. Omdat de bestaande constructie maar beperkt belastbaar was, koos OTH voor een licht staalskelet met een volledig glazen, dubbele klimaatgevel. Twee verticale portalen met trappen en panoramaliften ontsluiten het volume. Kraanspoor wordt algemeen gezien als het startschot van de commerciële herontwikkeling van de werf. Het is niet publiek toegankelijk, maar vanaf de kade goed te zien.</p>\n<h3>Media, hotels en de 'mix-to-the-max'</h3>\n<p>Rond 2002 werd een transformatieplan gepresenteerd, in 2003 volgde een cultuurhistorische effectrapportage, in 2008 een strategiebesluit en in 2012 — na een milieueffectrapportage — het investeringsbesluit. Het credo werd <em>mix-to-the-max</em>: cultuur, media, horeca en wonen door elkaar. Media- en merkbedrijven volgden de kunstenaars: MTV nam zijn intrek in de voormalige timmerwerkplaats, Red Bull in gerenoveerde hallen, en met <strong>Number One</strong> kwam er een nieuw kantoorgebouw van 40.000 m² voor onder meer HEMA en VNU Media. De historische <strong>kraan 13</strong> werd omgebouwd tot het Faralda Crane Hotel, met drie suites in de kraan. De Lasloods huisvest sinds enkele jaren het STRAAT Museum voor street art. Horeca als IJ-kantine, Noorderlicht en Pllek gaven het terrein een publieke levendigheid.</p>\n<h3>Wonen: de stad rukt op</h3>\n<p>Het oostelijke, monumentale deel bleef grotendeels cultureel. Het westelijke deel werd in de jaren 2010 in hoog tempo volgebouwd door Amsterdam Waterfront (een consortium van VolkerWessels/Biesterbos en investeerder Reggeborgh). De gemeente mikte op ongeveer 2.100 woningen, met een basishoogte van 30 meter en accenten tot 60 meter.</p>\n<ul>\n<li><strong>NieuwDok</strong> (Moke Architecten, 2016) — 380 studentenwoningen en een ROC.</li>\n<li><strong>De Werf</strong> (OZ, 2017) — een gesloten bouwblok van 85 × 100 meter met gebouwen van 22 tot 60 meter hoog: 403 studentenwoningen, 543 vrijesectorhuurwoningen en 1.100 m² commerciële ruimte. Archined prees de gesloten bouwbloktypologie en de goed gedetailleerde plint, maar bekritiseerde dat de gemeenschappelijke lounges en daktuinen privé bleven — een 'teleurstellende trend' op een plek die groot werd door openheid.</li>\n<li><strong>Pontkade</strong> (de Architekten Cie, 2020) — ca. 250 woningen in blokken van wisselende hoogte rond een binnenhof, elk met een eigen materiaal maar een gedeelde industriële toon. In de plint horeca, supermarkt, winkels, werkplaatsen en culturele functies; de architecten spreken van 'stad in de stad'. Het complex moet de schakel vormen tussen bestaand en nieuw.</li>\n<li><strong>NoordDok</strong> — meer dan 300 starterswoningen.</li>\n</ul>\n<p>Die verdichting schuurt. Voormalig directeur Kim Tuin waarschuwde dat de woningbouw de culturele vrijheid bedreigt die de werf groot maakte; de gemeente beloofde 'uiterst voorzichtig' te werk te gaan. Discussies gingen over bouwhoogtes, over sociale huur naast de vele studentenwoningen, en over een basisschool. Het is een Amsterdamse les die ook in Gent herkenbaar is: tijdelijk gebruik maakt een plek waardevol, en die waarde wordt vervolgens door de markt ingelost.</p>\n<h3>Waarom interessant voor ons</h3>\n<p>De NDSM-werf toont twintig jaar transformatie op één terrein: van informele toe-eigening via casco-architectuur (Kunststad) en erfgoed als drager (Kraanspoor) naar marktgedreven verdichting (De Werf, Pontkade). Het is het ideale vertrekpunt om de rest van de reis — Buiksloterham, Oostenburg, Houthavens — tegen af te zetten.</p>\n<h3>Om op te letten tijdens de wandeling</h3>\n<ul>\n<li>Het contrast tussen de ruwe scheepsbouwloods en de gladde glazen doos op de kraanbaan.</li>\n<li>Kijk in de loods: het stalen casco van Kunststad en de binnenstraten.</li>\n<li>De bewaarde hellingen en kranen als openbare ruimte.</li>\n<li>De schaalsprong naar De Werf en Pontkade, en hoe hun plint het plein probeert te activeren.</li>\n<li>Waar het gebied privé wordt: daktuinen, binnenhoven, poorten.</li>\n</ul>\n<h3 class=\"src\">Bronnen en verder lezen</h3>\n<ul>\n<li><a href=\"https://arcam.nl/architectuur-gids/ndsm-loods/\" target=\"_blank\" rel=\"noopener\">Arcam — NDSM-Loods</a></li>\n<li><a href=\"https://arcam.nl/architectuur-gids/kraanspoor/\" target=\"_blank\" rel=\"noopener\">Arcam — Kraanspoor</a></li>\n<li><a href=\"https://www.archdaily.com/2967/kraanspoor-oth-ontwerpgroep-trude-hooykaas-bv\" target=\"_blank\" rel=\"noopener\">ArchDaily — Kraanspoor / OTH</a></li>\n<li><a href=\"https://www.architectuurgids.nl/project/list_projects_of_typeofbuilding/typ_id/16/prj_id/1636\" target=\"_blank\" rel=\"noopener\">Architectuurgids.nl — Atelierstad NDSM, Dynamo Architecten</a></li>\n<li><a href=\"https://www.archined.nl/2000/02/ndsm-terrein-nieuwe-broedplaats-voor-amsterdam/\" target=\"_blank\" rel=\"noopener\">Archined — NDSM-terrein nieuwe broedplaats voor Amsterdam? (2000)</a></li>\n<li><a href=\"https://www.archined.nl/2019/04/de-werf-kloek-bouwblok-maakt-stedelijke-pretenties-bijna-waar/\" target=\"_blank\" rel=\"noopener\">Archined — De Werf: kloek bouwblok maakt stedelijke pretenties bijna waar</a></li>\n<li><a href=\"https://arcam.nl/architectuur-gids/pontkade/\" target=\"_blank\" rel=\"noopener\">Arcam — Pontkade</a></li>\n<li><a href=\"https://www.nul20.nl/dossiers/ndsm-stad-rukt-op\" target=\"_blank\" rel=\"noopener\">NUL20 — NDSM: de stad rukt op</a></li>\n<li><a href=\"https://www.herbestemming.nl/projecten/ndsm-terrein-amsterdam\" target=\"_blank\" rel=\"noopener\">Herbestemming.nl — NDSM-terrein</a></li>\n<li><a href=\"https://oth.nl/projecten/kraanspoor\" target=\"_blank\" rel=\"noopener\">OTH — Kraanspoor</a></li>\n</ul>",

"html": "<h3>Van rederijkade tot woonwijk</h3>\n<p>Het KNSM-eiland is genoemd naar de Koninklijke Nederlandsche Stoomboot Maatschappij, de rederij die vanaf het einde van de 19e eeuw vanaf deze kades naar de Middellandse Zee en Zuid-Amerika voer. De straat- en gebouwnamen — Piraeus, Barcelona, Levantkade, Venetiëhof — verwijzen nog naar die bestemmingen. Met de opkomst van de containervaart in de jaren 1960 verhuisde de haven naar het westen en raakte het Oostelijk Havengebied in onbruik. In de jaren 1970 en 1980 trokken krakers, kunstenaars en kleine bedrijven de leegstaande loodsen in.</p>\n<p>Toen Amsterdam eind jaren 1980 besloot het gebied om te vormen tot woonwijk, werd bewust gekozen om de havenbekkens niet te dempen. Elk schiereiland kreeg een eigen supervisor en een eigen stedenbouwkundige logica. Dat maakt het Oostelijk Havengebied vandaag tot een openluchtmuseum van Nederlandse woningbouw rond 1990–2000: KNSM (Coenen), Java-eiland (Sjoerd Soeters) en Borneo-Sporenburg (West 8) staan letterlijk naast elkaar, elk met een ander antwoord op dezelfde vraag.</p>\n<h3>Coenen: grote vormen op havenschaal</h3>\n<p>Jo Coenen koos voor een formeel plan met robuuste, grote woongebouwen die de maat van de verdwenen pakhuizen overnemen. Langs de centrale KNSM-laan liggen grote superblokken; een aantal historische havengebouwen werd bewaard en in de nieuwe composities opgenomen. Coenen ontwierp zelf de kop van het eiland. Waar Soeters op Java-eiland bewust kleine kavels en veel variatie per gevel inzette, is KNSM het eiland van het grote gebaar. Criticus-reflecties wijzen erop dat de architecten binnen hun bouwveld veel vrijheid kregen, met een minder eenduidig geheel als gevolg — maar ook met enkele sleutelwerken van de Nederlandse woningbouw.</p>\n<h3>Piraeus — Kollhoff &amp; Rapp (1994)</h3>\n<p>Piraeus is het eerste Nederlandse werk van de Berlijnse architect Hans Kollhoff, samen met Christian Rapp, en een van de invloedrijkste woongebouwen van zijn generatie. Het blok telt 304 woningen, 20 bedrijfsruimtes en 105 ondergrondse parkeerplaatsen, voor een budget van €15,5 miljoen. Ongeveer 95% van de woningen was sociale huur.</p>\n<p>Coenens plan schreef een eenvoudig gesloten bouwblok voor. Kollhoff en Rapp moesten echter rekening houden met twee gegevens: een bestaand havengebouw aan de Levantkade dat bewaard moest blijven, en de tuin van landschapsarchitecte Mien Ruys ernaast. Ze vervormden het blok daarom drastisch: de gevellijnen knikken en plooien rond het oude gebouw, en de daklijn daalt vloeiend van negen lagen aan de noordzijde naar vier aan de zuidkant. Zo komt zon in de binnenhof en ontstaan rond het gebouw uiteenlopende publieke ruimtes. Een vernuftig systeem van entrees, galerijen en centrale kernen ontsluit de enorme variatie aan plattegronden.</p>\n<p>De gevel is volledig in donkere baksteen, met houten elementen en steeds wisselende raampatronen. Dat was in het Nederland van 1994 — gedomineerd door witte, abstracte modernismen — bijna provocerend. Arcam noemt Piraeus het startpunt van de Nederlandse architectuurmode rond de eeuwwisseling met donkere baksteen en een zware, sculpturale architectuur. In een recent Archined-artikel (2025) blikken architecten Groothuijse en De Boer terug: Piraeus verwijst naar Manhattanse brandtrappen, Hamburgs expressionisme en havenarchitectuur, maar altijd via abstractie en nooit letterlijk. De hedendaagse Amsterdamse bakstenen nieuwbouw kopieert vaak het uiterlijk, zonder het onderliggende principe: één grote vorm die bewust een rol in de stad speelt.</p>\n<h3>Emerald Empire — Jo Coenen (1996)</h3>\n<p>Op de kop van het eiland plaatste Coenen zelf een rond woongebouw van acht lagen. Het bevat 206 driekamerwoningen en 18 grote vierkamerwoningen. Door de cirkelvorm zijn de plattegronden waaiervormig, met de woonruimtes langs de omtrek. De achttien grote woningen aan de noordoostzijde hebben uitkragende erkers met zicht over het IJ, wat het silhouet bewust asymmetrisch maakt. De ronde vorm voorkomt een anonieme rotonde aan het einde van de KNSM-laan en vormt een oriëntatiepunt vanaf de centrale as. Rond het gebouw liggen villa's aan het water, eveneens van Coenen.</p>\n<h3>Langhaus &amp; Hofhaus — Diener &amp; Diener (2001)</h3>\n<p>Op de naad tussen KNSM- en Java-eiland bouwde het Zwitserse Diener &amp; Diener na een gewonnen prijsvraag (1995) twee gebouwen die als toegangspoort tot het woongebied werken. Het <strong>Langhaus</strong> is een langgerekt blok van acht lagen met 127 woningen en 26.000 m², met twee grote uitsparingen die doorzicht bieden. Het <strong>Hofhaus</strong> is een vierkant blok met 45 woningen rond een gemeenschappelijke hof met galerij; op de begane grond zitten een restaurant en ateliers. De twee zijn verspringend geplaatst om op de knik tussen de eilanden ruimtelijke diepte te creëren.</p>\n<p>Beide zijn bekleed met roodbruine baksteen en een ogenschijnlijk strak raster van ramen. Diener &amp; Diener beschrijft de subtiliteit: de ramen verspringen per verdieping een halve steen, naar analogie met het metselverband, waardoor elke frontaliteit of statische werking verdwijnt. In de kleurrijke omgeving vormen de gebouwen volgens Arcam een visueel rustpunt. Het is een schoolvoorbeeld van hoe Diener &amp; Diener met ingetogen middelen — één materiaal, één raamtype — stedelijke betekenis maakt.</p>\n<h3>Waarom interessant voor ons</h3>\n<p>KNSM toont de terugkeer van het grote bouwblok en van baksteen in de Nederlandse woningbouw, en is de directe voorloper van wat we later in Oostenburg en de Houthavens zien. Piraeus is bovendien een les in hoe een streng stedenbouwkundig kader en een onverwachte randvoorwaarde samen tot een beter gebouw leiden.</p>\n<h3>Om op te letten tijdens de doorrit</h3>\n<ul>\n<li>De geknikte gevel en dalende daklijn van Piraeus, en het oude havengebouw dat erin ingeklemd zit.</li>\n<li>Loop even de binnenhof van Piraeus in, indien open.</li>\n<li>Het verspringende raam-ritme van Diener &amp; Diener en de uitsparingen in het Langhaus.</li>\n<li>Het contrast met de kleinschalige, gevarieerde gevels van Java-eiland aan de overkant.</li>\n<li>De ronde vorm van Emerald Empire als eindpunt van de as.</li>\n</ul>\n<h3 class=\"src\">Bronnen en verder lezen</h3>\n<ul>\n<li><a href=\"https://arcam.nl/architectuur-gids/piraeus/\" target=\"_blank\" rel=\"noopener\">Arcam — Piraeus</a></li>\n<li><a href=\"https://www.archined.nl/2025/03/terug-naar-piraeus/\" target=\"_blank\" rel=\"noopener\">Archined — Terug naar Piraeus (2025)</a></li>\n<li><a href=\"https://www.rappenrapp.com/project/piraeus/\" target=\"_blank\" rel=\"noopener\">Rapp+Rapp — Piraeus</a></li>\n<li><a href=\"https://arcam.nl/architectuur-gids/langhaus-hofhaus/\" target=\"_blank\" rel=\"noopener\">Arcam — Langhaus &amp; Hofhaus</a></li>\n<li><a href=\"https://www.dienerdiener.ch/de/project/residential-buildings-knsm-and-java-island\" target=\"_blank\" rel=\"noopener\">Diener &amp; Diener — Wohnhäuser KNSM- und Java-Eiland</a></li>\n<li><a href=\"https://journals.open.tudelft.nl/dash/article/view/4634\" target=\"_blank\" rel=\"noopener\">DASH — Hofblok Hoogwerf Amsterdam: Diener &amp; Diener</a></li>\n<li><a href=\"https://arcam.nl/architectuur-gids/emerald-empire/\" target=\"_blank\" rel=\"noopener\">Arcam — Emerald Empire</a></li>\n<li><a href=\"https://www.jocoenen.com/cv/pages/knsm/index.html\" target=\"_blank\" rel=\"noopener\">Jo Coenen — KNSM-eiland</a></li>\n<li><a href=\"https://www.architectuurgids.nl/project/list_projects_of_typeofbuilding/typ_id/3/prj_id/1548\" target=\"_blank\" rel=\"noopener\">Architectuurgids.nl — Stedenbouwkundig plan KNSM-eiland</a></li>\n</ul>",

"html": "<h3>Context</h3>\n<p>Het Funen ligt aan de oostrand van de binnenstad, ingeklemd tussen het spoor naar Amsterdam Centraal, de Cruquiuskade en de negentiende-eeuwse Czaar Peterbuurt. Tot eind jaren 1990 lag hier een spoorwegemplacement en het overslagterrein van vervoerder Van Gend &amp; Loos. Het is het broertje van Oostenburg, dat letterlijk aan de overkant van het water ligt. Architour vat het contrast mooi samen: beide gebieden hebben een industrieel verleden, maar kozen voor totaal verschillende modellen om een binnenstedelijk braakliggend terrein om te vormen tot een wijk.</p>\n<h3>Het concept: een scherm en een park vol villa's</h3>\n<p>Frits van Dongen (de Architekten Cie., later Rijksbouwmeester) loste twee problemen in één gebaar op. Langs het spoor en de Cruquiuskade plaatste hij een lang, haakvormig gebouw dat in hoogte oploopt: een geluidsscherm dat tegelijk ongeveer 305 woningen bevat — maisonnettes, woon-werkappartementen en penthouses, plus sociale huurwoningen voor ouderen en mensen met een beperking. Aan de spoorzijde kreeg het een extra glazen gevel met gekleurde glazen 'schubben' die het treingeluid tegenhouden. Een deel van de gevel verbergt achter een stalen bekleding van 35 meter een transformatorstation van de NS; daarboven zitten studentenwoningen.</p>\n<p>In de luwte van dit scherm ligt een autovrij park waarin zestien losse stadsvilla's staan, elk door een andere architect ontworpen, met telkens een beperkt aantal woningen (tot een twaalftal per blok). Het principe is vergelijkbaar met een beeldenpark: autonome objecten in een doorlopend groen veld. Alle auto's gaan ondergronds, in een garage met 395 plaatsen.</p>\n<h3>Geen privétuinen</h3>\n<p>De meest radicale keuze is het ontbreken van privétuinen en privacyschermen. De woningen op de begane grond krijgen alleen een strook van ongeveer twee meter voor eigen gebruik; de rest is één doorlopende, collectieve ruimte. LANDLAB spreekt van 'één continue binnenhof' voor zestien blokken. Architour noemt het resultaat een buurt die als samenhangend geheel leest, zonder een gated community te worden. Het was een controversiële keuze en blijft een debat: werkt collectief groen zonder afbakening, en wie onderhoudt het?</p>\n<h3>LANDLAB: gras, stenen en robinia's</h3>\n<p>Landschapsarchitect Bram Breedveld (LANDLAB) werkte met slechts drie ingrediënten: gras, verharding en verspreide bomen. De paden zijn opgebouwd uit speciaal ontworpen vijfhoekige betonstenen in drie grijstinten, willekeurig gelegd zodat een richtingloos, ruw patroon ontstaat dat van boven als een visnet leest. De tegel won in 2007 een Dutch Design Award. Verspreid over het park staan zo'n 170 robinia's (valse acacia's), met transparante kronen die het licht doorlaten naar de villa's. In het voorjaar kleuren narcissen het gras geel. Het project won in 2011 de Gouden Piramide, de rijksprijs voor inspirerend opdrachtgeverschap.</p>\n<h3>De stadsvilla's</h3>\n<p>Binnen het strakke kader gaven de architecten elk blok een eigen karakter. Het bekendste is <strong>Blok K 'Verdana' van NL Architects</strong> (2009), met een gekantelde, 'ijsberg'-achtige vorm en uitgesproken raampatronen; ArchDaily documenteert het uitgebreid met plannen en doorsneden. Andere blokken van DKV, Geurst &amp; Schulze, Dick van Gameren en Claus en Kaan tonen elk een ander antwoord op dezelfde opgave: hoe maak je een compact appartementengebouw zonder achterkant, dat aan alle zijden in een openbaar park staat?</p>\n<h3>Funenhof — Arons en Gelauff (2018)</h3>\n<p>Aan de rand van het park, tussen Funenpark en Czaar Peterstraat, bouwde Arons en Gelauff met de Funenhof een hedendaags Amsterdams hofje met acht grondgebonden woningen van 105 tot 155 m² (samen ca. 2.700 m²) op een voormalig fabrieksterrein van ongeveer 50 bij 40 meter, omringd door achtertuinen. Het kernelement is <strong>'de huif'</strong>: een houten luifel die zowel horizontaal als verticaal doorloopt. Ze laat de gevel maximaal transparant, maar voorkomt schuine inkijk; ze biedt schaduw, draagt planten en dient als zitrand. De gevel ligt vijf meter terug van de oude pakhuizen, om afstand te houden. De interieurs werden samen met de bewoners ontworpen. Het project was genomineerd voor de Amsterdamse Nieuwbouwprijs 2019.</p>\n<h3>Waarom interessant voor ons</h3>\n<p>Funen is een van de meest consequente Nederlandse experimenten met hoge dichtheid (150 woningen/ha) zonder gesloten bouwblok, en een sterk voorbeeld van hoe een landschapsontwerp met minimale middelen een wijk samenhoudt. De spanning tussen het collectieve park en de wens tot privacy is voor elke woningbouwopgave in Vlaanderen herkenbaar.</p>\n<h3>Om op te letten tijdens de wandeling</h3>\n<ul>\n<li>Het schermgebouw: de glazen schubbengevel aan de spoorzijde tegenover de bakstenen parkzijde.</li>\n<li>De vijfhoekige tegel en hoe het patroon routes suggereert zonder ze vast te leggen.</li>\n<li>De overgang tussen woning en park: de strook van 2 meter, en hoe bewoners die (niet) toe-eigenen.</li>\n<li>Blok K van NL Architects en de verschillen in hoe elke villa zijn 'achterkant' oplost.</li>\n<li>De huif van de Funenhof als gelaagde privacy-oplossing.</li>\n</ul>\n<h3 class=\"src\">Bronnen en verder lezen</h3>\n<ul>\n<li><a href=\"https://landlab.nl/projects/funenpark\" target=\"_blank\" rel=\"noopener\">LANDLAB — Funenpark</a></li>\n<li><a href=\"https://landezine.com/funenpark-by-landlab/\" target=\"_blank\" rel=\"noopener\">Landezine — Funenpark by LANDLAB</a></li>\n<li><a href=\"https://journals.open.tudelft.nl/dash/article/view/4660\" target=\"_blank\" rel=\"noopener\">DASH — Funenpark Amsterdam: de Architekten Cie.</a></li>\n<li><a href=\"https://www.archdaily.com/559408/funen-blok-k-verdana-nl-architects\" target=\"_blank\" rel=\"noopener\">ArchDaily — Funen Blok K / NL Architects</a></li>\n<li><a href=\"https://architectuurwijzer.be/funenpark-wonen-in-een-autovrij-binnengebied/\" target=\"_blank\" rel=\"noopener\">Architectuurwijzer — Funenpark, wonen in een autovrij binnengebied</a></li>\n<li><a href=\"http://www.architectuurgids.nl/project/list_projects_of_typeofbuilding/typ_id/3/prj_id/1633\" target=\"_blank\" rel=\"noopener\">Architectuurgids.nl — Woningbouw Funenpark</a></li>\n<li><a href=\"https://www.dearchitect.nl/projecten/arc18-funenhof-amsterdam-arons-en-gelauff-architecten\" target=\"_blank\" rel=\"noopener\">De Architect — ARC18: Funenhof</a></li>\n<li><a href=\"https://aronsengelauff.nl/projecten/funenhof/\" target=\"_blank\" rel=\"noopener\">Arons en Gelauff — Funenhof</a></li>\n<li><a href=\"https://www.architour.nl\" target=\"_blank\" rel=\"noopener\">Architour — tourbeschrijving</a></li>\n</ul>",

"html": "<h3>Een werkeiland</h3>\n<p>Oostenburg is een van de drie Oostelijke Eilanden die in de 17e eeuw in het IJ werden aangelegd, samen met Kattenburg en Wittenburg. Waar die twee woonwijken werden, bleef Oostenburg een werkeiland. De Verenigde Oost-Indische Compagnie bouwde er haar scheepswerf en haar enorme zeemagazijn; later namen Werkspoor en Stork het eiland over voor de bouw van locomotieven, scheepsmotoren en machines. De <strong>Van Gendthallen</strong>, ontworpen door architect-ingenieur A.L. van Gendt rond de eeuwwisseling, bestaan uit vijf gekoppelde hallen: de eerste drie hebben een kerkachtige opbouw met hoger middenschip en zijbeuken, de latere zijn sober en functioneel. De <strong>Werkspoorhal</strong> dateert van 1929. Na het vertrek van de industrie in de jaren 1990 kwam het eiland in handen van kantoren, onder meer het INIT-gebouw, tot de herontwikkeling vanaf 2012 op gang kwam.</p>\n<h3>Het plan: de spontane stad</h3>\n<p>Architour zet Oostenburg tegenover Funen: waar Funen kiest voor een samenhangend, rustig park, is Oostenburg 'urban, dense and deliberately rough in character'. Urhahn tekende het stedenbouwkundig plan, het masterplan voor de openbare ruimte en het beeldkwaliteitsplan; Studioninedots werkte samen met hen de bouwenveloppen uit. Hun gedeelde uitgangspunt is 'de Spontane Stad': een stad die niet tot in detail wordt vastgelegd, maar kan groeien en veranderen, en mee wordt vormgegeven door de gebruikers.</p>\n<p>Concreet legt het bestemmingsplan alleen de essentie vast — pandbreedtes, straatbreedtes, woninggroottes — en laat het veel vrijheid in functie en architectuur. Studioninedots paste zijn <strong>Cityplot</strong>-methode toe (die we vrijdag ook in Buiksloterham zien): per kavel een bouwenvelop waarbinnen ontwikkelaars en architecten vrij kunnen ontwerpen, met als resultaat een hoge architectonische diversiteit. Hoge woontorens staan tegenover lange werkgebouwen; kleinere gebouwen nestelen zich tussen grote bestaande volumes zoals de Van Gendthallen en het INIT-gebouw. Het eiland is vrijwel autovrij: een parkeergebouw aan de entree wordt dubbel gebruikt door bewoners en werkers. Daarnaast zijn er informele binnenhoven, doorgangen en open trappenhuizen die ontmoeting stimuleren.</p>\n<p>Het resultaat is een dichtheid die voor Amsterdam zeer hoog is, met behoud van menselijke maat. Het woningaantal groeide tijdens de planvorming van 800 naar ongeveer 1.900. Duurzaamheid zit in het ontwerp: regenwater infiltreert op het volledige voorheen verharde oppervlak en er werd geëxperimenteerd met bodemwarmte. Het plan werd genomineerd voor de NEPROM-prijs en werd in de ARC22-selectie van De Architect opgenomen. Tijdens het proces waren er drie ontwerpateliers in Pakhuis de Zwijger met bewoners, en een laatste buurtplein werd samen met bewoners tot moestuin ontworpen. Een begeleidend 'living lab'-onderzoek volgt hoe gemeenschapsvorming in zo'n nieuwe gemengde wijk verloopt.</p>\n<h3>Stadswerf Oostenburg</h3>\n<p>Het grootste deelproject is <strong>Stadswerf Oostenburg</strong>: een volledig bouwblok met negen kavels en 32 gebouwen, samen 551 woningen (113 sociaal, 29 middenhuur, 316 vrije sector huur, 73 koop) en 7.000 m² kantoren, winkels en ateliers. Drie bureaus — Ronald Janssen, Bastiaan Jongerius en Paul de Ruiter — verdeelden niet de kavels maar de afzonderlijke gebouwen onder elkaar, om een zo groot mogelijke variatie te krijgen. Baksteen, beton, staal en hout zorgen voor samenhang; de gebouwhoogtes variëren van 19 tot 26 meter; de binnenhof is een groene oase met deels groene daken.</p>\n<h3>De Werkspoorhal</h3>\n<p>Het hart van het eiland wordt de monumentale <strong>Werkspoorhal</strong> (1929). Ontwikkelaar VORM won een selectie van Stadgenoot met het plan 'Werkspoor', met een team van OZ, Workshop architecten, BETA, Space Encounters en LOLA Landscape Architects. De hal wordt een overdekt openbaar plein en sociaal knooppunt aan het water — 'een commerciële ontmoetingsplek met kathedraalachtige proporties', waarbij het oorspronkelijke leidingwerk als kunstwerk bewaard blijft. De nieuwe woongebouwen sluiten direct op de hal aan. VORM bouwt op Oostenburg in totaal zo'n 1.000 huur- en koopwoningen. De Van Gendthallen worden door eigenaar Eduard Zanen omgevormd tot een mix van start-ups, winkels, horeca en cultuur, met woningen op de hoeken en het oude spoor als publieke doorgang; een eerste deel opent in het najaar van 2026.</p>\n<h3>Houtrak</h3>\n<p>Aan de kop van de Oostenburgervaart staat <strong>Houtrak</strong> (2025) van Marcel Lok_Architect en Workshop architecten: 36 appartementen in twee volumes. Een blok van zes lagen is gebouwd met het modulaire houten CD20-systeem met prefab betonvloeren en heeft een gevel en balkons van hergebruikt azobé; een blok van vier lagen is bekleed met zwartbruine metalen cassettes onder sheddaken. Een gedeelde binnenhof verbindt beide, met een daktuin van Flux landschapsarchitectuur.</p>\n<h3>Waarom interessant voor ons</h3>\n<p>Oostenburg is een actueel manifest van hoe je in Nederland vandaag een binnenstedelijke wijk maakt: veel spelers, strakke randvoorwaarden en veel vrijheid binnen die randvoorwaarden. De vergelijking met Funen, twintig jaar ouder en aan de overkant van het water, toont hoe het denken over dichtheid, erfgoed en gemengdheid is verschoven.</p>\n<h3>Om op te letten tijdens de wandeling</h3>\n<ul>\n<li>De korrelgrootte: hoe smalle panden en wisselende hoogtes een 'gegroeide' straat simuleren.</li>\n<li>De plint: welke functies zitten er, en hoe open is ze echt?</li>\n<li>De Werkspoorhal en de Van Gendthallen: hoe wordt erfgoed publieke ruimte?</li>\n<li>De collectieve binnenhoven en open trappenhuizen als schakel tussen privé en publiek (Workshop architecten).</li>\n<li>Parkeren: waar zijn de auto's?</li>\n</ul>\n<h3 class=\"src\">Bronnen en verder lezen</h3>\n<ul>\n<li><a href=\"https://www.archdaily.com/1022964/oostenburg-island-studioninedots\" target=\"_blank\" rel=\"noopener\">ArchDaily — Oostenburg Island / Urhahn + Studioninedots</a></li>\n<li><a href=\"https://www.designboom.com/architecture/studioninedots-replan-oostenburg-island-industrial-heritage-urban-density-10-30-2024/\" target=\"_blank\" rel=\"noopener\">Designboom — Urhahn &amp; Studioninedots' Oostenburg replan</a></li>\n<li><a href=\"https://www.dearchitect.nl/275495/arc22-oostenbrug-amsterdam-urhahn-stedenbouw-strategie\" target=\"_blank\" rel=\"noopener\">De Architect — ARC22: Oostenburg, Urhahn</a></li>\n<li><a href=\"https://www.urhahn.com/projecten/amsterdam-oostenburg/\" target=\"_blank\" rel=\"noopener\">Urhahn — Amsterdam Oostenburg</a></li>\n<li><a href=\"https://studioninedots.nl/project/oostenburg/\" target=\"_blank\" rel=\"noopener\">Studioninedots — Oostenburg</a></li>\n<li><a href=\"https://arcam.nl/architectuur-gids/stadswerf-oostenburg/\" target=\"_blank\" rel=\"noopener\">Arcam — Stadswerf Oostenburg</a></li>\n<li><a href=\"https://arcam.nl/architectuur-gids/van-gendthallen/\" target=\"_blank\" rel=\"noopener\">Arcam — Van Gendthallen</a></li>\n<li><a href=\"https://www.nul20.nl/vorm-maakt-van-werkspoorhal-op-oostenburg-ontmoetingsplek\" target=\"_blank\" rel=\"noopener\">NUL20 — VORM maakt van Werkspoorhal ontmoetingsplek</a></li>\n<li><a href=\"https://architectenweb.nl/nieuws/artikel.aspx?id=59395\" target=\"_blank\" rel=\"noopener\">Architectenweb — Houtrak</a></li>\n<li><a href=\"https://www.workshop.archi/oostenburg/\" target=\"_blank\" rel=\"noopener\">Workshop architecten — Oostenburg</a></li>\n<li><a href=\"https://www.metalocus.es/en/news/industrial-heritage-and-urban-density-oostenburg-studioninedots\" target=\"_blank\" rel=\"noopener\">Metalocus — Industrial heritage and urban density</a></li>\n</ul>",

"html": "<h3>Context: de Westelijke Tuinsteden verdichten</h3>\n<p>Westbeat staat op de hoek van de Delflandlaan en de Cornelis Lelylaan, vlak bij station Lelylaan en de ring A10, aan de rand van de Westelijke Tuinsteden. Die werden na de Tweede Wereldoorlog gebouwd volgens het Algemeen Uitbreidingsplan (1934–1935) van Cornelis van Eesteren: open verkaveling, veel licht, lucht en groen, en een strikte scheiding van functies. Vandaag is Nieuw-West een van de grootste verdichtingsopgaves van Amsterdam. Rond station Lelylaan wordt het monofunctionele kantoren- en infrastructuurlandschap omgevormd tot een gemengd stedelijk knooppunt. Westbeat was een van de eerste projecten die dat ambitieus invulden.</p>\n<p>De Lelylaan is een as van zo'n anderhalve kilometer die het centrum met de Westelijke Tuinsteden verbindt, en de ontwikkeling ervan is volgens Gebiedsontwikkeling.nu 'een museum van tien jaar gebiedsontwikkeling'. Het oostelijke deel (het Andreas Ensemble, 477 woningen en een hotel) werd nog vóór de crisis van 2008 op de klassieke manier gerealiseerd: één groot consortium van ontwikkelaar en corporatie, hoge dichtheid. Na de crisis koos de gemeente voor het middendeel, <strong>Podium Lelylaan</strong>, een andere aanpak: kleinere kavels, lager risico, gefaseerde uitgifte, betrokkenheid van eindgebruikers, studentenhuisvesting, creatieve werkruimte en collectief particulier opdrachtgeverschap. Westbeat is het vlaggenschip van dat Podium. Studioninedots ontwierp er ook het naburige Little Manhattan, en tussen beide werd later een kavel getenderd voor de transformatie van het monumentale voormalige Calvijn College met minstens 3.500 m² culturele werkruimte. Arcam beschrijft het gebouw als een zandkasteel dat boven de A10 oprijst en dat, met zijn verspringende lagen, zowel het hoogteverschil ter plaatse als de symbolische afstand tussen het centrum en Nieuw-West overbrugt.</p>\n<h3>Het concept: een 'superspace' onder de woningen</h3>\n<p>De opgave was een woongebouw voor jonge stedelingen, maar Studioninedots las de vraag breder: hoe word je een sociale bestemming in een wijk met veel ruimte maar weinig echte publieke plekken? Het antwoord is de sokkel: een 65 bij 50 meter grote, 8,5 meter hoge ruimte, gedragen door 86 betonnen bogen. Het bureau spreekt van een 'superspace' en introduceerde het begrip <strong>'wandervoids'</strong>: publieke ruimtes zonder vastgelegde functie, als antwoord op overgedetermineerde stedelijke omgevingen. In de bogen passen werkruimtes, horeca, voorstellingen en concerten, en ze kunnen in de loop der jaren van functie wisselen.</p>\n<p>Albert Herder: 'Om van Westbeat een sociale bestemming te maken, moet de architectuur een statement zijn: zo'n enorme publieke ruimte met bogen creëert de wow-factor die we voor ogen hadden.'</p>\n<p>De bogen doen meer dan indruk maken. Ze vormen de structurele en visuele overgang tussen de parkeerkelder en de woonlagen erboven, ze vangen de hoogteverschillen op het terrein op met voetgangersroutes, en aan de gevel kaderen de glazen boogvelden van wisselende maat de activiteiten binnen. Een uitsparing op de hoek laat het gebouw 'de stad omarmen'.</p>\n<h3>De woningen</h3>\n<p>Boven de sokkel liggen 150 compacte starterswoningen rond een collectieve binnentuin en podium. Omdat het gebouw aan zware verkeersaders ligt, zijn de gevels geluidsdempend uitgevoerd en werken groene galerijen als buffer. De woonlagen hebben een geometrisch gevelpatroon dat contrasteert met de zware bogen eronder.</p>\n<h3>Jury Gouden AAP</h3>\n<p>In 2021 won Westbeat zowel de vakjuryprijs als de publieksprijs van de Gouden AAP, de Amsterdamse architectuurprijs. De jury: het project 'laat zien wat mogelijk wordt als de gemeente financiële en programmatische ruimte geeft om iets moois te maken'. Die opmerking is belangrijk: de publieke sokkel was alleen haalbaar omdat de gemeente een deel van de commerciële druk wegnam.</p>\n<h3>Waarom interessant voor ons</h3>\n<p>Westbeat is een pleidooi voor een plint die meer is dan een commerciële strook: een echte, ruimtelijk genereuze publieke ruimte die de woningen draagt. Het is ook een voorbeeld van hoe één sterk structureel motief — de boog — tegelijk constructie, ruimte en identiteit levert. Samen met Cornelis, dat er vlak naast staat, vormt het een mooi tweeluik over verdichting in de naoorlogse stad.</p>\n<h3>Om op te letten ter plaatse</h3>\n<ul>\n<li>De maat van de boogruimte: 8,5 meter hoog, en hoe het licht erin valt.</li>\n<li>Hoe de bogen het hoogteverschil tussen straat en hof opvangen.</li>\n<li>Wat er vandaag in de plint gebeurt: werkt de 'wandervoid'?</li>\n<li>De overgang tussen zware sokkel en lichtere woonlagen.</li>\n<li>De relatie met Cornelis en het stationsgebied.</li>\n</ul>\n<h3 class=\"src\">Bronnen en verder lezen</h3>\n<ul>\n<li><a href=\"https://studioninedots.nl/project/westbeat/\" target=\"_blank\" rel=\"noopener\">Studioninedots — Westbeat</a></li>\n<li><a href=\"https://www.designboom.com/architecture/arches-studioninedots-westbeat-housing-complex-amsterdam-02-13-2021/\" target=\"_blank\" rel=\"noopener\">Designboom — 86 arches form Studioninedots' Westbeat</a></li>\n<li><a href=\"https://www.domusweb.it/en/architecture/gallery/2021/01/28/re-thinking-public-spaces-a-multifunctional-complex-in-amsterdam.html\" target=\"_blank\" rel=\"noopener\">Domus — Westbeat by Studioninedots</a></li>\n<li><a href=\"https://arcam.nl/events/rondleidingen-in-westbeat-van-studioninedots/\" target=\"_blank\" rel=\"noopener\">Arcam — Rondleidingen Westbeat</a></li>\n<li><a href=\"https://archello.com/project/westbeat\" target=\"_blank\" rel=\"noopener\">Archello — Westbeat</a></li>\n<li><a href=\"https://www.gebiedsontwikkeling.nu/artikelen/amsterdam-lelylaan-een-museum-van-10-jaar-gebiedsontwikkeling/\" target=\"_blank\" rel=\"noopener\">Gebiedsontwikkeling.nu — Amsterdam Lelylaan: een museum van 10 jaar gebiedsontwikkeling</a></li>\n</ul>",

"html": "<h3>De vraag: wat hebben jonge gezinnen nodig in de stad?</h3>\n<p>Cornelis staat pal naast Westbeat, aan de Cornelis Lelylaan, en is — net als zijn buurman — een antwoord op de verdichting van Nieuw-West. Maar de doelgroep is een andere: gezinnen met kinderen, die Amsterdam traditioneel verlaten zodra het appartement te klein wordt. De architecten vertrokken van de vraag wat jonge gezinnen nodig hebben om in de stad te blijven wonen. Het antwoord is niet in de eerste plaats een grotere woning, maar collectieve ruimte, beweging en ontmoeting. Het project sluit aan bij het Amsterdamse programma 'Bewegende Stad', dat buitenspelen en bewegen in het stedelijk ontwerp wil verankeren.</p>\n<p>De naam verwijst naar de straat, maar ook naar Cornelis van Eesteren, wiens Westelijke Tuinsteden met hun collectieve groen en ruimte voor beweging de inspiratie waren. Cornelis vertaalt dat idee van horizontaal naar verticaal: een 'verticale stad'.</p>\n<h3>Een gebouw om rondjes in te rennen</h3>\n<p>Het hart van het gebouw is de circulatie. De interne gang is uitzonderlijk breed en hoog — zes meter, over twee lagen — en werkt als een binnenstraat waar kinderen kunnen spelen en fietsen. Langs die straat liggen dubbelhoge woningen; speciaal ontworpen deuren met inkijk laten buurkinderen elkaar zien. Aan de zuidgevel klimt een getrapte tuin langs het gebouw omhoog, bereikbaar voor alle bewoners, met picknicktafels, moestuinen, zandbakken en pleintjes op elk niveau. De niveaus zijn verbonden met stalen trappen én houten glijbanen. Die route doet tegelijk dienst als vluchtweg.</p>\n<p>FARO vat het zo samen: 'Kinderen kunnen uiteindelijk rondjes rennen: vanuit de hal, via de corridor, over de terrassen, terug de hal in.'</p>\n<h3>Plint en materialen</h3>\n<p>Aan de zuidkant heeft het gebouw een dubbelhoge, transparante plint met kinderopvang, buitenschoolse opvang, horeca en ateliers, die het gebouw direct met de buurt en het Schielandplein verbindt. De noordgevel aan de Cornelis Lelylaan is robuust en stedelijk; de zuidgevel verfijnd, met een markant houten raamwerk van azobé waaraan de terrassen hangen. Er werd een eigen grijsgroene baksteen ontwikkeld. Binnen lopen eiken trappen, bamboe kozijnen en parket, en in hal en plint zorgt Green Dolomite natuursteen voor de overgang tussen binnen en buiten. De woningen variëren van ateliers op de begane grond, via dubbelhoge woningen tot studio-appartementen met verdiepte hoge ruimtes.</p>\n<h3>Kritiek</h3>\n<p>Architectuurcriticus Jaap Huisman noemt Cornelis 'een verrijking in de westelijke tuinsteden', opgeleverd met 'grote zorg en liefde', en wijst op details als de zigzaggende brievenbussen bij de entree, 'die kom je hooguit tegen bij de Amsterdamse School'. Hij plaatst ook kanttekeningen: 'De bewoners van het appartement bij die glijbaan moeten voorbereid zijn op reuring voor hun deur', de formule van een speelpaleis 'zal niet ieders cup of tea zijn', en de vraag blijft wat er gebeurt 'als de klimjeugd verandert in hangjongeren'.</p>\n<h3>Waarom interessant voor ons</h3>\n<p>Cornelis is zeer recent (opgeleverd oktober 2025) en is meteen Gebouw van het Jaar in de categorie Leefbaarheid. Het is een helder voorbeeld van hoe circulatie- en collectieve ruimte — vaak het eerste waarop bespaard wordt — hier de kern van het concept en van de woonkwaliteit is. Relevant voor elke meergezinswoning die gezinnen wil aantrekken.</p>\n<h3>Om op te letten ter plaatse</h3>\n<ul>\n<li>De binnenstraat van zes meter hoog: maat, licht en materiaal.</li>\n<li>De getrapte tuin en de glijbanen: hoe zijn veiligheid en vluchtweg opgelost?</li>\n<li>De twee gezichten: robuuste noordgevel tegenover het houten raamwerk aan de zuidkant.</li>\n<li>De speciaal ontwikkelde grijsgroene baksteen.</li>\n<li>De verhouding met Westbeat: twee manieren om de plint publiek te maken.</li>\n</ul>\n<h3 class=\"src\">Bronnen en verder lezen</h3>\n<ul>\n<li><a href=\"https://bna.nl/cornelis/\" target=\"_blank\" rel=\"noopener\">BNA — Cornelis, Gebouw van het Jaar 2026</a></li>\n<li><a href=\"https://arcam.nl/architectuur-gids/cornelis/\" target=\"_blank\" rel=\"noopener\">Arcam — Cornelis</a></li>\n<li><a href=\"https://architectenweb.nl/nieuws/artikel.aspx?id=60106\" target=\"_blank\" rel=\"noopener\">Architectenweb — Woongebouw voor gezinnen biedt ruime corridor en gekoppelde terrassen met glijbaan</a></li>\n<li><a href=\"https://architectenweb.nl/projecten/project.aspx?ID=43318\" target=\"_blank\" rel=\"noopener\">Architectenweb — projectpagina Cornelis</a></li>\n<li><a href=\"https://faro.nl/projecten/cornelis-amsterdam/\" target=\"_blank\" rel=\"noopener\">FARO — Cornelis</a></li>\n<li><a href=\"https://www.vanbergenarchitectura.nl/projecten/cornelis/\" target=\"_blank\" rel=\"noopener\">Van Bergen Architectura — Cornelis</a></li>\n<li><a href=\"https://www.jaaphuisman.nl/werk/een-speeltuin-om-in-te-wonen\" target=\"_blank\" rel=\"noopener\">Jaap Huisman — Een speeltuin om in te wonen</a></li>\n</ul>",

"html": "<h3>Het Weissman-gebouw</h3>\n<p>Het oorspronkelijke museum werd in 1895 geopend, naar ontwerp van architect A.W. Weissman: een bakstenen gebouw in neorenaissancestijl, met torentjes, een monumentale trap en grote zalen met daglicht. Het was gebouwd voor een verzameling kunst en kunstnijverheid, maar groeide in de 20e eeuw uit tot een van de belangrijkste musea voor moderne en hedendaagse kunst ter wereld. Onder directeur Willem Sandberg (1945–1962) werden de interieurs volledig wit geschilderd — de 'witte kubus' als neutrale achtergrond voor moderne kunst, een model dat wereldwijd navolging kreeg. Sandberg voegde in 1954 ook een glazen vleugel toe, die later plaats moest maken voor de nieuwe uitbreiding.</p>\n<h3>Twintig jaar uitbreidingsodyssee</h3>\n<p>De uitbreiding kende een lange en moeizame voorgeschiedenis. Begin jaren 1990 lag er een renovatieplan van Robert Venturi, dat de nieuwe directeur Rudi Fuchs in 1993 van tafel veegde. Daarna werkte de Portugese architect Álvaro Siza tien jaar lang (1994–2004) aan een uitbreiding, die uiteindelijk werd afgeblazen omdat de kosten uit de hand liepen. In 2004 werd Benthem Crouwel gekozen uit een volledig Nederlandse shortlist. Het museum week tijdens de bouw uit naar tijdelijke locaties, onder meer het Post CS-gebouw aan het IJ (2004–2008), en organiseerde 'Stedelijk Goes to Town' verspreid over de stad.</p>\n<p>Ook de bouw zelf liep uit: gepland op vier jaar, werden het er acht. Aannemer Midreth ging in 2011 failliet, er waren problemen met de funderingsputten en met constructieve berekeningen, en de heropening werd herhaaldelijk uitgesteld. Het budget groeide volgens Domus van de oorspronkelijke €17 miljoen naar €127 miljoen bij oplevering. De sloop van de Sandberg-vleugel werd een symbolisch moment: directeur Gijs van Tuyl reed er met een graafmachine in en wethouder Carolien Gehrels gooide een steen door een raam — beelden die critici later als overmoedig bestempelden, omdat die vleugel met zijn grote ramen naar de straat voor velen het democratische, toegankelijke museum symboliseerde. Het museum heropende op 23 september 2012, in een periode van zware bezuinigingen op cultuur.</p>\n<h3>De Badkuip</h3>\n<p>In 2004 won Benthem Crouwel de opdracht voor de uitbreiding. Hun antwoord is een glad, wit volume dat de Amsterdammers al snel 'de badkuip' noemden. Het is uitgevoerd als een naadloze schil van vezelversterkt composiet op basis van Twaron, een aramidevezel die ook in kogelvrije vesten en zeilen wordt gebruikt, zodat er geen voegen in de gevel zitten. Een deel van het volume zit onder de grond; het bovenste deel zweeft boven het plein. Het dak kraagt ver uit en vormt een overdekt voorplein.</p>\n<p>De belangrijkste stedenbouwkundige ingreep is de verplaatsing van de ingang naar het Museumplein. Het oude museum keerde zich met zijn hoofdingang naar de Paulus Potterstraat; nu opent het zich met een volledig glazen, transparante inkomhal naar het plein. Onder het maaiveld ligt een tentoonstellingshal van 1.100 m², met bibliotheek en kenniscentrum. Op het niveau van het plein zitten de entree, de winkel en het restaurant. Twee ingesloten roltrappen door de 'badkuip' verbinden de ondergrondse hal met de bovenzalen, zodat bezoekers de inkomhal kunnen overslaan.</p>\n<p>Het Weissman-gebouw werd gerestaureerd, met behoud van de monumentale trap, de grote zalen en het natuurlijke licht, en consequent in het wit dat Sandberg introduceerde.</p>\n<h3>Ontvangst</h3>\n<p>De uitbreiding was bij opening in 2012 omstreden: te groot, te glad, 'een badkuip' naast een monument. Domus erkende dat de transparante voet de compositie lichter maakt en het Museumplein uitnodigend binnenhaalt. Architectuur.nl rekende na dat de beloofde 'verdubbeling' van de tentoonstellingsruimte in werkelijkheid een netto winst van zo'n 1.345 m² opleverde, ongeveer 24% meer dan in 2003, vooral dankzij de ondergrondse hal. Intussen is het een icoon van het Museumplein en een vaak aangehaald voorbeeld van een uitbreiding die het contrast opzoekt in plaats van zich aan te passen. De Architects' Journal sprak van 'metamorphology'.</p>\n<h3>Om op te letten</h3>\n<ul>\n<li>De naad (of het ontbreken ervan) in de composietgevel.</li>\n<li>De overgang van de glazen inkomhal naar het bakstenen Weissman-gebouw.</li>\n<li>De monumentale trap in het oude deel tegenover de roltrappen in de badkuip.</li>\n<li>De ondergrondse tentoonstellingshal: hoe wordt daglicht gemist of vervangen?</li>\n</ul>\n<h3 class=\"src\">Bronnen en verder lezen</h3>\n<ul>\n<li><a href=\"https://www.benthemcrouwel.com/projects/stedelijk-museum\" target=\"_blank\" rel=\"noopener\">Benthem Crouwel — Stedelijk Museum</a></li>\n<li><a href=\"https://www.archdaily.com/350843/stedelijk-museum-amsterdam-benthem-crouwel-architects\" target=\"_blank\" rel=\"noopener\">ArchDaily — Stedelijk Museum / Benthem Crouwel</a></li>\n<li><a href=\"https://www.dezeen.com/2012/09/06/stedelijk-museum-amsterdam-by-benthem-crouwel-architects/\" target=\"_blank\" rel=\"noopener\">Dezeen — Stedelijk Museum by Benthem Crouwel</a></li>\n<li><a href=\"https://www.architectsjournal.co.uk/archive/metamorphology-benthem-crouwels-stedelijk-museum\" target=\"_blank\" rel=\"noopener\">Architects' Journal — Metamorphology</a></li>\n<li><a href=\"https://www.wallpaper.com/architecture/stedelijk-museum-designed-by-benthem-crouwel-architects-amsterdam\" target=\"_blank\" rel=\"noopener\">Wallpaper* — Stedelijk Museum</a></li>\n<li><a href=\"https://www.domusweb.it/en/architecture/2012/10/22/the-stedelijk-is-back.html\" target=\"_blank\" rel=\"noopener\">Domus — The Stedelijk is back</a></li>\n<li><a href=\"https://www.architectuur.nl/project/eindelijk-af/\" target=\"_blank\" rel=\"noopener\">Architectuur.nl — Eindelijk af</a></li>\n</ul>",

"html": "<blockquote>\n<p><strong>In memoriam — Yayoi Kusama (1929–2026).</strong> Kusama overleed op 14 augustus 2026, 97 jaar oud, in Tokio. Deze retrospectieve opende vier weken later en is de eerste grote overzichtstentoonstelling na haar dood.</p>\n</blockquote>\n<h3>Een tentoonstelling die een afscheid werd</h3>\n<p>De retrospectieve was jaren voorbereid als reizende overzichtstentoonstelling: eerst in de Fondation Beyeler in Basel (oktober 2025 – januari 2026), dan in Museum Ludwig in Keulen (maart – augustus 2026) en nu in Amsterdam. Op 14 augustus 2026 overleed Kusama op 97-jarige leeftijd in een ziekenhuis in Tokio. Volgens haar studio bleef ze 'schilderen tot haar laatste dagen, zonder ooit haar penseel neer te leggen'. De Amsterdamse editie, die vier weken later opende, is daardoor de eerste grote overzichtstentoonstelling na haar dood geworden.</p>\n<h3>Leven en werk</h3>\n<p>Kusama werd in 1929 geboren in Matsumoto, Japan, in een gezin van zaadhandelaars. Al als kind had ze hallucinaties van stippen en netten die haar omgeving leken te overwoekeren — het beeld van 'zelfvernietiging' (self-obliteration), dat de rode draad in haar werk werd. Na een opleiding in de traditionele Japanse schilderkunst (nihonga) vertrok ze in 1957 naar de Verenigde Staten en vestigde ze zich in New York.</p>\n<p>Daar maakte ze vanaf eind jaren 1950 naam met de <strong>Infinity Net</strong>-schilderijen: enorme doeken die volledig bedekt zijn met kleine, herhaalde lusjes van verf, zonder begin of einde. Ze werden in verband gebracht met zowel het minimalisme als het abstract expressionisme. Begin jaren 1960 volgden de <strong>Accumulations</strong>: meubels, boten en kledingstukken bedekt met zachte, genaaide fallische vormen, die als voorlopers van de pop art en de soft sculpture gelden. In 1965 maakte ze de eerste <strong>Infinity Mirror Room</strong>, <em>Phalli's Field</em>, waarin spiegels een veld van stippen tot in het oneindige herhalen. Later in de jaren 1960 organiseerde ze happenings en naakte performances in de openbare ruimte van New York, tegen de oorlog in Vietnam.</p>\n<p>Ook met Nederland was er vroeg een band: Kusama nam in 1965 deel aan de legendarische Nul-tentoonstelling in het Stedelijk, samen met de Europese Zero- en Nul-kunstenaars. Die link met het museum maakt deze retrospectieve extra betekenisvol.</p>\n<p>In 1973 keerde ze terug naar Japan. Vanaf 1977 woonde ze op eigen verzoek in een psychiatrische instelling in Tokio, en werkte ze elke dag in haar atelier aan de overkant van de straat. Vanaf de late jaren 1980 volgde de internationale herontdekking: ze vertegenwoordigde Japan op de Biënnale van Venetië in 1993 met een spiegelkamer vol pompoenen, en werd in de 21e eeuw een van de meest bezochte kunstenaars ter wereld. Haar gele pompoenen met zwarte stippen, de reeks <em>My Eternal Soul</em> en de publieksmagneten van de Infinity Rooms maakten haar een wereldwijd icoon; in 2016 werd ze door Time uitgeroepen tot een van de meest invloedrijke mensen ter wereld.</p>\n<h3>In de tentoonstelling</h3>\n<p>De tentoonstelling volgt die hele boog: van vroege werken op papier uit Japan via de Infinity Nets, de Accumulations, documentatie van de happenings en haar werk in mode en literatuur, tot de recente, felgekleurde schilderijen. Twee Infinity Mirrored Rooms uit 2025 — onder meer een nieuw werk, speciaal voor deze reeks gemaakt — sluiten het parcours af.</p>\n<h3>Waarom interessant voor ons</h3>\n<p>Kusama's werk is in de kern ruimtelijk: haar spiegelkamers zijn kleine architecturen die met herhaling, licht en reflectie de grenzen van de ruimte laten verdwijnen. Voor een groep architecten is het interessant om te kijken hoe zij met minimale middelen (een doos, spiegels, lampjes) een ervaring van oneindigheid maakt, en hoe de museumzalen van Weissman en de badkuip van Benthem Crouwel die ervaring omkaderen.</p>\n<h3>Om op te letten</h3>\n<ul>\n<li>De schaal: hoe groot zijn de Infinity Nets echt, van dichtbij en van ver?</li>\n<li>De Infinity Rooms: waar zit de deur, waar zit de lichtbron, hoe wordt de ruimte opgeheven?</li>\n<li>Het contrast tussen de vroege, sombere werken en de late, knalkleurige schilderijen.</li>\n<li>De link met de Nul-beweging en de collectie van het Stedelijk.</li>\n</ul>\n<h3 class=\"src\">Bronnen en verder lezen</h3>\n<ul>\n<li><a href=\"https://www.stedelijk.nl/en/exhibitions/yayoi-kusama-en\" target=\"_blank\" rel=\"noopener\">Stedelijk Museum — Yayoi Kusama</a></li>\n<li><a href=\"https://yayoi-kusama.jp/en/news4518/\" target=\"_blank\" rel=\"noopener\">Yayoi Kusama Official — Announcement of the Passing</a></li>\n<li><a href=\"https://amsterdamexperiences.nl/blog/yayoi-kusama-amsterdam-stedelijk/\" target=\"_blank\" rel=\"noopener\">Amsterdam Experiences — Kusama at the Stedelijk</a></li>\n<li><a href=\"https://www.npr.org/2026/08/26/1102916697/yayoi-kusama-high-priestess-of-polka-dots-has-died\" target=\"_blank\" rel=\"noopener\">NPR — Yayoi Kusama has died at 97</a></li>\n<li><a href=\"https://www.washingtontimes.com/news/2026/sep/10/stedelijk-museum-amsterdam-opens-yayoi-kusama-exhibition-death-last/\" target=\"_blank\" rel=\"noopener\">Washington Times — Stedelijk opens Kusama exhibition after her death</a></li>\n</ul>",

"html": "<h3>Het onderwijs: Agora</h3>\n<p>Xplore is een school voor Agora-onderwijs, een model dat in Nederland de voorbije tien jaar opgang maakte. Er zijn geen vakken, geen roosters en geen klassen in de klassieke zin. Elke leerling volgt een eigen leerroute op basis van nieuwsgierigheid en eigen 'challenges', begeleid door 'coaches' in plaats van leraren, in kleine coachgroepen. Leren wordt gecombineerd met plezier, autonomie en samenwerking. De school is opgedeeld in kleinere 'deelscholen' binnen één gebouw. De resultaten zijn opvallend: 89% van de eerste examenlichting haalde een diploma op of boven het verwachte niveau en stroomde succesvol door.</p>\n<p>Xplore is volgens de architecten het <strong>eerste schoolgebouw in Nederland dat volledig voor Agora-onderwijs is ontworpen</strong>. Dat betekent dat bijna alle vanzelfsprekendheden van een schoolgebouw — gangen, lokalen van 60 m², kluisjes, een omheind schoolplein — ter discussie stonden.</p>\n<h3>Het ontwerpproces</h3>\n<p>Studio Ard Hoksbergen en VDNDP wonnen in de zomer van 2021 de architectenselectie van ZAAM. Daarna volgde een intensief participatietraject: zes maanden lang werkten leerlingen, coaches en externe experts wekelijks samen met de architecten om de onderwijsvisie in ruimte te vertalen. Die betrokkenheid ging tot in het detail. Leerlingen beslisten mee over de reliëfmallen in het beton, en de plafondhoogtes werden mee bepaald door het meubilair dat de leerlingen het liefst gebruiken. Het dakterras wacht nog op de invulling van de leerlingen zelf.</p>\n<h3>De agora als hart</h3>\n<p>Het gebouw staat op een L-vormig perceel en is georganiseerd rond een centrale aula van <strong>10 meter hoog</strong>, met een veelhoekige plattegrond en zichtbare houten spanten — een hedendaagse versie van de agora, het marktplein van de oude Griekse stad. Die ruimte is aankomstplek, lunchruimte, ontmoetingsplek en organisatorisch centrum tegelijk. Wie binnenkomt, loopt via een donkerrode, gefacetteerde entree met een schuin dak de heldere aula in: een bewuste overgang van donker naar licht.</p>\n<p>Vanuit de aula vertrekken twee vleugels met de 35 coachruimtes. Ze worden ontsloten via lichthoven, zodat er geen donkere middengangen ontstaan. Flexibele scheidingswanden laten toe ruimtes samen te voegen of te scheiden naargelang het onderwijs evolueert — het bureau spreekt van een 'hyperflexibele school'.</p>\n<h3>Zien en gezien worden</h3>\n<p>Een kernidee is zichtbaarheid. De zes makerspaces zijn met glazen wanden uitgevoerd, zodat de activiteiten voor de hele school zichtbaar zijn. Leerlingen zien wat anderen doen en kunnen spontaan leermogelijkheden ontdekken — een ruimtelijke vertaling van het Agora-principe dat nieuwsgierigheid de motor is.</p>\n<h3>Een school zonder hek</h3>\n<p>Xplore heeft geen hek of poort. In het midden van het gebouw zit een <strong>grand café</strong> dat naar de straat opent en de buurt, ouders en externe experts binnenhaalt. De keuken heeft een loket waar buurtbewoners iets kunnen drinken. Lokale ondernemers met een link naar onderwijs hebben er een kantoor. In een wijk als Elzenhagen, een nieuwe uitbreidingswijk in Amsterdam-Noord, maakt dat de school tot een buurtvoorziening.</p>\n<h3>Materialen</h3>\n<p>Het gebouw is grotendeels in beton uitgevoerd, met een reliëf dat ontstaat door ingelegde baksteen in de bekisting, gecombineerd met rood, schuin gemetseld metselwerk in ritmische patronen. Het kleurenpalet is geïnspireerd op de 'bonte grijzen' van de Bossche School — een interessante referentie voor Vlaamse architecten die die traditie kennen. Aan de gevel zijn nestkasten geïntegreerd.</p>\n<h3>Waarom interessant voor ons</h3>\n<p>Scholen zijn een terugkerende opgave. Xplore toont wat er gebeurt als een radicaal onderwijsconcept consequent wordt doorvertaald: geen gangen, glazen makerspaces, een centrale ruimte als hart en een gebouw dat zich naar de buurt opent. Het participatieproces met leerlingen is bovendien een model voor hoe gebruikers echt kunnen meeontwerpen.</p>\n<h3>Vragen voor Freek</h3>\n<ul>\n<li>Hoe werkt het gebouw na een jaar gebruik? Wat werkt, wat niet?</li>\n<li>Worden de flexibele wanden echt verplaatst?</li>\n<li>Hoe gaat de school om met akoestiek in de open aula?</li>\n<li>Hoe wordt het grand café door de buurt gebruikt?</li>\n</ul>\n<h3>Om op te letten</h3>\n<ul>\n<li>De overgang van de donkerrode entree naar de lichte aula.</li>\n<li>De houten spanten en de veelhoekige vorm van de agora.</li>\n<li>De lichthoven in de vleugels.</li>\n<li>Het betonreliëf met ingelegde baksteen.</li>\n<li>De zichtbaarheid van de makerspaces.</li>\n</ul>\n<h3 class=\"src\">Bronnen en verder lezen</h3>\n<ul>\n<li><a href=\"https://bna.nl/xplore-agora-amsterdam/\" target=\"_blank\" rel=\"noopener\">BNA — Xplore Agora, Gebouw van het Jaar 2026</a></li>\n<li><a href=\"https://architectenweb.nl/nieuws/artikel.aspx?id=60005\" target=\"_blank\" rel=\"noopener\">Architectenweb — Studio Ard Hoksbergen herkent en vertaalt wensen van Xplore Agora</a></li>\n<li><a href=\"https://arcam.nl/architectuur-gids/xplore-agora-amsterdam/\" target=\"_blank\" rel=\"noopener\">Arcam — Xplore Agora</a></li>\n<li><a href=\"https://ardhoksbergen.nl/project/xplore-agora/\" target=\"_blank\" rel=\"noopener\">Studio Ard Hoksbergen — Xplore</a></li>\n<li><a href=\"https://vdndp.nl/projecten/xplore-agora/\" target=\"_blank\" rel=\"noopener\">VDNDP — Xplore Agora</a></li>\n<li><a href=\"https://retaildesignblog.net/2026/06/26/xplore-agora-school-amsterdam-by-studio-ard-hoksbergen/\" target=\"_blank\" rel=\"noopener\">Retail Design Blog — Xplore Agora</a></li>\n</ul>",
